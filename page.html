<style>
/* ── HERO ── */
.pg-hero { position:relative; min-height:440px; height:60vh; max-height:640px; display:flex; align-items:flex-end; overflow:hidden; background:var(--midnight); }
.pg-hero-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.pg-hero::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(to top, rgba(27,33,24,0.86) 0%, rgba(27,33,24,0.38) 55%, rgba(27,33,24,0.12) 100%); }
.pg-hero-content { position:relative; z-index:2; width:100%; max-width:var(--max-width); margin:0 auto; padding:0 80px 64px; }
.pg-eyebrow { font-family:var(--font-ui); font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--lingon-light); margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.pg-eyebrow::before { content:''; width:32px; height:1px; background:currentColor; flex-shrink:0; }
.pg-hero h1 { font-family:var(--font-display); font-size:clamp(42px,6vw,88px); font-weight:300; line-height:1.0; color:var(--snow); max-width:780px; text-wrap:balance; }
.pg-hero h1 em { font-style:italic; color:var(--lingon-light); }
.pg-hero-sub { font-family:var(--font-body); font-size:18px; line-height:1.65; color:rgba(255,255,255,0.86); max-width:540px; margin-top:20px; }
/* Sans photo : fond sable, titre à l'encre */
.pg-hero.no-img { background:var(--cream); min-height:0; height:auto; border-bottom:1px solid var(--linen); }
.pg-hero.no-img::after { display:none; }
.pg-hero.no-img .pg-hero-content { padding:64px 80px 56px; }
.pg-hero.no-img .pg-eyebrow { color:var(--lingon); }
.pg-hero.no-img h1 { color:var(--midnight); }
.pg-hero.no-img h1 em { color:var(--lingon); }
.pg-hero.no-img .pg-hero-sub { color:var(--slate); }

/* ── FIL D'ARIANE ── */
.pg-crumb { background:var(--cream); border-bottom:1px solid var(--linen); }
.pg-crumb-in { max-width:var(--max-width); margin:0 auto; padding:0 80px; display:flex; flex-wrap:wrap; align-items:center; gap:0 10px; font-family:var(--font-ui); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dust); }
.pg-crumb a { display:inline-block; padding:14px 0; color:var(--dust); text-decoration:underline; text-decoration-color:var(--birch); text-underline-offset:3px; }
.pg-crumb a:hover { color:var(--lingon); }

/* ── TEXTE ── */
.pg-text { max-width:720px; margin:0 auto; padding:80px 40px; }
.pg-text + .pg-text { padding-top:0; }
.pg-text h2, .pg-split-text h2 { font-family:var(--font-display); font-size:clamp(30px,3.4vw,48px); font-weight:300; line-height:1.1; color:var(--midnight); margin-bottom:24px; text-wrap:balance; }
.pg-divider { width:48px; height:1px; background:var(--linen); margin:0 0 28px; }
.pg-text p, .pg-split-text p { font-family:var(--font-body); font-size:18px; line-height:1.9; color:var(--slate); margin-bottom:18px; }
.pg-text p:last-child, .pg-split-text p:last-child { margin-bottom:0; }

/* ── TEXTE + PHOTO ── */
.pg-split { display:grid; grid-template-columns:1fr 1fr; min-height:540px; border-top:1px solid var(--linen); border-bottom:1px solid var(--linen); }
.pg-split-img { overflow:hidden; background:var(--parchment); }
.pg-split-img img { width:100%; height:100%; object-fit:cover; }
.pg-split-text { padding:80px 64px; display:flex; flex-direction:column; justify-content:center; background:var(--cream); }
.pg-split.reverse .pg-split-img { order:1; }

/* ── CITATION ── */
.pg-quote { background:var(--parchment); padding:88px 40px; text-align:center; border-top:1px solid var(--linen); border-bottom:1px solid var(--linen); }
.pg-quote blockquote { max-width:800px; margin:0 auto; font-family:var(--font-display); font-size:clamp(24px,3vw,40px); font-style:italic; font-weight:300; line-height:1.45; color:var(--midnight); }

/* ── PHOTO ── */
.pg-img { margin:0; background:var(--midnight); }
.pg-img img { width:100%; max-height:580px; object-fit:cover; }
.pg-img figcaption { font-family:var(--font-ui); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dust); text-align:center; padding:16px 40px; background:var(--cream); border-bottom:1px solid var(--linen); }

/* ── SIGNATURE + SUITE ── */
.pg-sign { max-width:720px; margin:0 auto; padding:0 40px 72px; }
.pg-sign-name { font-family:var(--font-display); font-size:32px; font-style:italic; font-weight:400; color:var(--heather-text); line-height:1.1; }
.pg-sign-role { font-family:var(--font-ui); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dust); margin-top:6px; }
.pg-next { background:var(--cream); border-top:1px solid var(--linen); }
.pg-next-in { max-width:720px; margin:0 auto; padding:64px 40px 72px; text-align:center; }
.pg-next h2 { font-family:var(--font-display); font-size:clamp(28px,3.2vw,42px); font-weight:300; color:var(--midnight); margin-bottom:22px; }
.pg-next h2 em { font-style:italic; color:var(--lingon); }
.pg-next-links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
.pg-next-links .btn-outline-dark { min-height:44px; }

/* ── ÉTATS ── */
.pg-state { max-width:640px; margin:0 auto; text-align:center; padding:120px 24px; font-family:var(--font-body); font-size:19px; line-height:1.7; color:var(--dust); }
.pg-state .pg-next-links { margin-top:24px; }
.pg-state button { min-height:48px; cursor:pointer; }

@media (max-width:1024px) {
  .pg-hero-content { padding:0 32px 52px; }
  .pg-hero.no-img .pg-hero-content { padding:48px 32px 44px; }
  .pg-crumb-in { padding:0 32px; }
  .pg-text { padding:64px 32px; }
  .pg-split { grid-template-columns:1fr; min-height:0; }
  .pg-split-img { min-height:320px; order:0 !important; }
  .pg-split-text { order:1; padding:52px 32px; }
  .pg-quote { padding:64px 32px; }
  .pg-sign { padding:0 32px 64px; }
}
@media (max-width:640px) {
  .pg-hero { min-height:380px; height:56vh; }
  .pg-hero-content { padding:0 20px 36px; }
  .pg-hero.no-img .pg-hero-content { padding:36px 20px 32px; }
  .pg-crumb-in { padding:0 20px; }
  .pg-text { padding:44px 20px; }
  .pg-text p, .pg-split-text p { font-size:17px; }
  .pg-split-text { padding:40px 20px; }
  .pg-quote { padding:52px 20px; }
  .pg-sign { padding:0 20px 52px; }
  .pg-next-in { padding:48px 20px 56px; }
  .pg-next-links a { flex:1 1 100%; text-align:center; }
}
</style>

<body>
<div id="header-root"></div>
<main id="page-content" aria-busy="true">
  <div class="pg-state" data-sv="Laddar…" data-fr="Chargement…" data-en="Loading…">Chargement…</div>
</main>

<script>
/* Page CMS : servie à /a-propos (« Notre histoire »), ou page.html?slug=…
   Les pages légales ont leur version statique, à jour : on y renvoie. */
var PG_LEGAL = { 'cgv': '/cgv', 'mentions-legales': '/mentions-legales', 'politique-confidentialite': '/confidentialite', 'confidentialite': '/confidentialite' };
var _pgSlug = (function () {
  var s = new URLSearchParams(location.search).get('slug') || location.pathname.replace(/^\/+|\/+$/g, '').replace(/\.html$/, '');
  return (!s || s === 'page') ? 'a-propos' : s.replace(/[^\w\-]/g, '');
})();
if (PG_LEGAL[_pgSlug]) location.replace(PG_LEGAL[_pgSlug]);

var PG_T = {
  home:     { fr: 'Accueil', en: 'Home', sv: 'Hem' },
  notFound: { fr: 'Cette page est introuvable.', en: 'This page cannot be found.', sv: 'Sidan finns inte.' },
  error:    { fr: 'Cette page ne peut pas s’afficher pour le moment.', en: 'This page cannot be displayed right now.', sv: 'Sidan kan inte visas just nu.' },
  retry:    { fr: 'Réessayer', en: 'Try again', sv: 'Försök igen' },
  shop:     { fr: 'Voir la boutique', en: 'Visit the shop', sv: 'Till butiken' },
  recipes:  { fr: 'Nos recettes', en: 'Our recipes', sv: 'Våra recept' },
  contact:  { fr: 'Nous écrire', en: 'Write to us', sv: 'Skriv till oss' },
  next:     { fr: 'Envie de <em>goûter</em>&nbsp;?', en: 'Ready for a <em>taste</em>?', sv: 'Sugen på att <em>smaka</em>?' },
  role:     { fr: 'Fondatrice', en: 'Founder', sv: 'Grundare' }
};
function _pt(k) { var o = PG_T[k]; return o[LANG] || o.fr; }
function _pesc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
/* Titres du CMS : on garde seulement <em> et <br> (un mot en italique, comme ailleurs) */
function _pgTitle(s) { return _pesc(s).replace(/&lt;(\/?)em&gt;/g, '<$1em>').replace(/&lt;br\s*\/?&gt;/g, '<br>'); }
/* Titre du hero : sans <em> saisi dans le CMS, le dernier mot passe en italique (signature des titres du site) */
function _pgHeroTitle(s) {
  var h = _pgTitle(s);
  return /<em>/.test(h) ? h : h.replace(/(\s)([^\s<]+)\s*$/, '$1<em>$2</em>');
}
/* Texte du CMS : un paragraphe par ligne vide, un retour à la ligne simple reste un <br> */
function _pgParas(s) {
  return String(s || '').replace(/\r/g, '').split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(Boolean)
    .map(function (p) { return '<p>' + _pesc(p).replace(/\n/g, '<br>') + '</p>'; }).join('');
}
function _pgQuote(s) {
  var t = String(s || '').trim().replace(/^["«“”\s ]+|["»“”\s ]+$/g, '');
  return LANG === 'fr' ? '« ' + t + ' »' : LANG === 'sv' ? '”' + t + '”' : '“' + t + '”';
}
function _pgLinks() {
  return '<div class="pg-next-links"><a class="btn-primary" href="/boutique">' + _pt('shop') + '</a><a class="btn-outline-dark" href="/recettes">' + _pt('recipes') + '</a><a class="btn-outline-dark" href="/contact">' + _pt('contact') + '</a></div>';
}

var _pg = { state: 'loading', page: null };
function _pgRender() {
  var root = document.getElementById('page-content');
  if (_pg.state === 'loading') return;
  root.removeAttribute('aria-busy');
  if (_pg.state !== 'ok') {
    root.innerHTML = '<div class="pg-state"><p>' + _pt(_pg.state) + '</p>'
      + (_pg.state === 'error' ? '<p style="margin-top:20px"><button type="button" class="btn-outline-dark" onclick="_pgLoad()">' + _pt('retry') + '</button></p>' : '')
      + _pgLinks() + '</div>';
    return;
  }
  var page = _pg.page, lk = LANG === 'sv' ? 'sv' : LANG === 'en' ? 'en' : 'fr';
  var pick = function (o, k) { return (o && (o[k + '_' + lk] || o[k + '_fr'])) || ''; };
  var brand = (window.SD_WL && SD_WL.brand_name) || 'Swedish Cravings';
  var title = pick(page, 'title');
  var heroTitle = pick(page, 'hero_title') || title;
  var heroSub = pick(page, 'hero_subtitle');
  var html = '';

  html += '<section class="pg-hero' + (page.hero_image ? '' : ' no-img') + '">'
    + (page.hero_image ? '<img class="pg-hero-img" src="' + _pesc(page.hero_image) + '" alt="" fetchpriority="high">' : '')
    + '<div class="pg-hero-content"><p class="pg-eyebrow">' + _pesc(brand) + '</p>'
    + '<h1>' + _pgHeroTitle(heroTitle) + '</h1>'
    + (heroSub ? '<p class="pg-hero-sub">' + _pesc(heroSub) + '</p>' : '')
    + '</div></section>';

  html += '<nav class="pg-crumb" aria-label="' + (LANG === 'en' ? 'Breadcrumb' : LANG === 'sv' ? 'Brödsmulor' : 'Fil d’Ariane') + '"><div class="pg-crumb-in">'
    + '<a href="/">' + _pt('home') + '</a><span aria-hidden="true">/</span><span aria-current="page">' + _pesc(title) + '</span></div></nav>';

  var split = 0;
  (page.blocks || []).forEach(function (b) {
    if (b.type === 'text') {
      var bt = pick(b, 'title'), body = _pgParas(pick(b, 'body'));
      if (b.image) {
        html += '<section class="pg-split' + (split++ % 2 ? ' reverse' : '') + '"><div class="pg-split-text">'
          + (bt ? '<h2>' + _pgTitle(bt) + '</h2><div class="pg-divider"></div>' : '') + body + '</div>'
          + '<div class="pg-split-img"><img src="' + _pesc(b.image) + '" alt="" loading="lazy"></div></section>';
      } else {
        html += '<section class="pg-text">' + (bt ? '<h2>' + _pgTitle(bt) + '</h2><div class="pg-divider"></div>' : '') + body + '</section>';
      }
    } else if (b.type === 'quote') {
      var q = pick(b, 'text');
      if (q) html += '<div class="pg-quote"><blockquote>' + _pesc(_pgQuote(q)) + '</blockquote></div>';
    } else if (b.type === 'image' && b.url) {
      /* La légende décrit la photo : l'attribut alt reste vide pour ne pas la lire deux fois */
      html += '<figure class="pg-img"><img src="' + _pesc(b.url) + '" alt="" loading="lazy">'
        + (b.alt ? '<figcaption>' + _pesc(b.alt) + '</figcaption>' : '') + '</figure>';
    }
  });

  /* « Notre histoire » est écrite à la première personne par la fondatrice */
  if (_pgSlug === 'a-propos') {
    html += '<div class="pg-sign"><p class="pg-sign-name">Victoria</p><p class="pg-sign-role">' + _pt('role') + ', ' + _pesc(brand) + '</p></div>';
  }
  html += '<section class="pg-next"><div class="pg-next-in"><h2>' + _pt('next') + '</h2>' + _pgLinks() + '</div></section>';
  root.innerHTML = html;

  /* Autre page que « Notre histoire » : titre, adresse canonique et fil d'Ariane suivent la page */
  if (_pgSlug !== 'a-propos' && title) {
    document.title = title + ' | ' + brand;
    var url = 'https://www.swedishcravings.fr/page?slug=' + encodeURIComponent(_pgSlug);
    var c = document.getElementById('pg-canonical'); if (c) c.href = url;
    var ld = document.getElementById('pg-ld');
    if (ld) ld.textContent = JSON.stringify({ '@context': 'https://schema.org', '@type': 'BreadcrumbList', itemListElement: [
      { '@type': 'ListItem', position: 1, name: 'Accueil', item: 'https://www.swedishcravings.fr/' },
      { '@type': 'ListItem', position: 2, name: page.title_fr || title, item: url }] });
  }
}
function _pgNoIndex() {
  var m = document.querySelector('meta[name="robots"]');
  if (!m) { m = document.createElement('meta'); m.name = 'robots'; document.head.appendChild(m); }
  m.content = 'noindex';
}
function _pgLoad() {
  _pg.state = 'loading';
  var root = document.getElementById('page-content');
  root.setAttribute('aria-busy', 'true');
  root.innerHTML = '<div class="pg-state">' + (LANG === 'en' ? 'Loading…' : LANG === 'sv' ? 'Laddar…' : 'Chargement…') + '</div>';
  var BASE = window.SD_API_URL || 'https://admin.swedishcravings.fr';
  fetch(BASE + '/api/pages/' + encodeURIComponent(_pgSlug))
    .then(function (r) {
      if (r.status === 404) return { page: null, missing: true };
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (d) {
      var p = d && d.page;
      if (!p || p.is_published === false) { _pg.state = 'notFound'; _pgNoIndex(); }
      else { _pg.state = 'ok'; _pg.page = p; }
      _pgRender();
    })
    .catch(function () { _pg.state = 'error'; _pgRender(); });
}
function onLangChange() { _pgRender(); }

initPage(_pgSlug === 'a-propos' ? 'about' : _pgSlug);
if (!PG_LEGAL[_pgSlug]) _pgLoad();
</script>
