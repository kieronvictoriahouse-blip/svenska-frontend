<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<script>(function(){try{var w=JSON.parse(localStorage.getItem('sd_wl_v1'));if(w&&w.id){var r=document.documentElement.style;if(w.color_primary){r.setProperty('--heather',w.color_primary);r.setProperty('--heather-mid',w.color_primary+'CC');}if(w.color_secondary){r.setProperty('--lingon',w.color_secondary);r.setProperty('--lingon-mid',w.color_secondary+'CC');}if(w.color_bg)r.setProperty('--cream',w.color_bg);if(w.color_text)r.setProperty('--midnight',w.color_text);if(w.font_display)r.setProperty('--font-display',"'"+w.font_display+"',Georgia,serif");if(w.font_body)r.setProperty('--font-body',"'"+w.font_body+"',Georgia,serif");if(w.font_ui)r.setProperty('--font-ui',"'"+w.font_ui+"',sans-serif");}}catch(e){}}());</script>
<style>
/* En-tête compact : sur le panier, la place va au contenu et au paiement */
.page-hero{max-width:var(--max-width);margin:0 auto;padding:32px 40px 0;}
.page-hero h1{font-family:var(--font-display);font-size:clamp(30px,4vw,44px);font-weight:300;color:var(--midnight);line-height:1.1;}
.page-hero h1 em{font-style:italic;color:var(--lingon);}
.page-hero .hero-crumb{font-family:var(--font-ui);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);margin-bottom:10px;}
.page-hero .hero-crumb a{color:var(--dust);text-decoration:none;}
.page-hero .hero-crumb a:hover{color:var(--lingon);}
.page-hero + .section{padding-top:28px;}

/* Cart layout */
/* Articles, puis récapitulatif ; les suggestions viennent après le
   récapitulatif (sur mobile, elles ne repoussent plus le paiement). */
.cart-page-layout{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;grid-template-areas:"items summary" "more summary";column-gap:48px;align-items:start;}
.cart-page-items{grid-area:items;}
.cart-page-summary{grid-area:summary;}
.cart-page-more{grid-area:more;}
/* Empêche le contenu large (carrousel, champ relais) de forcer la grille à déborder l'écran */
.cart-page-items,.cart-page-summary,.cart-page-more{min-width:0;}
.cart-continue{font-family:var(--font-ui);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:8px 0;transition:color 0.15s;}
.cart-continue:hover{color:var(--heather-text);}

/* Items list */
.cart-page-items{}
.cart-page-heading{font-family:var(--font-ui);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dust);border-bottom:1px solid var(--linen);padding-bottom:14px;margin-bottom:0;display:grid;grid-template-columns:1fr auto auto;gap:16px;}
.cart-page-row{display:grid;grid-template-columns:88px 1fr auto auto;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--linen);}
.cpr-img{width:88px;height:88px;border-radius:2px;object-fit:contain;background:var(--warm-white);border:1px solid var(--linen);padding:6px;}
.cpr-info{}
.cpr-name{font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--midnight);margin-bottom:4px;}
.cpr-sub{font-family:var(--font-ui);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);}
.cpr-del{background:none;border:none;font-size:12px;color:var(--dust);padding:4px 8px;cursor:pointer;transition:color 0.15s;font-family:var(--font-ui);letter-spacing:1px;}
.cpr-del:hover{color:var(--lingon);}
.cpr-qty{display:flex;align-items:center;gap:0;border:1px solid var(--linen);background:var(--snow);}
.cpr-qty button{background:none;border:none;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--midnight);display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
.cpr-qty button:hover{background:var(--linen);}
.cpr-qty span{font-family:var(--font-ui);font-size:13px;width:28px;text-align:center;}
.cpr-price{font-family:var(--font-display);font-size:18px;color:var(--midnight);white-space:nowrap;min-width:60px;text-align:right;}

/* Empty state */
.cart-page-empty{text-align:center;padding:80px 20px;}
.cart-page-empty .empty-icon{color:var(--linen);margin-bottom:24px;}
.cart-page-empty h2{font-family:var(--font-display);font-size:32px;font-weight:300;color:var(--midnight);margin-bottom:12px;}
.cart-page-empty p{font-family:var(--font-body);font-size:17px;color:var(--dust);margin-bottom:32px;}

/* Summary box */
.cart-page-summary{background:var(--snow);border:1px solid var(--linen);padding:32px 28px;position:sticky;top:120px;}
/* Delivery toggle */
.delivery-toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--linen);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.dt-btn{background:var(--snow);border:none;padding:12px 8px;min-height:48px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--slate);cursor:pointer;transition:background 0.15s,color 0.15s;text-align:center;line-height:1.35;}
.dt-btn small{display:block;font-size:11px;letter-spacing:0.5px;text-transform:none;margin-top:3px;opacity:.85;}
.dt-btn.active{background:var(--heather);color:var(--on-heather);}
.dt-btn:disabled{opacity:.45;cursor:not-allowed;}
.dt-btn:not(:last-child){border-right:1px solid var(--linen);}
.summary-title{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--midnight);margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid var(--linen);}
.summary-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:var(--font-body);font-size:15px;color:var(--slate);}
.summary-line.total{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--midnight);margin-top:16px;padding-top:16px;border-top:1px solid var(--linen);margin-bottom:24px;align-items:flex-start;}
.summary-line.total > span:last-child{text-align:right;}
.summary-ship-bar{margin-bottom:20px;}
.summary-ship-text{font-family:var(--font-ui);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dust);margin-bottom:8px;line-height:1.45;}
.summary-bar{height:3px;background:var(--linen);border-radius:2px;overflow:hidden;}
.summary-bar-fill{height:100%;background:var(--moss);border-radius:2px;transition:width 0.4s ease;}
/* Le bouton qui compte le plus : couleur d'action franche, jamais l'air désactivé */
.btn-pay{width:100%;background:var(--lingon);color:var(--snow);border:none;padding:18px 24px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-bottom:12px;}
.btn-pay:hover{background:var(--lingon-hover);}
.btn-pay:disabled{cursor:progress;opacity:.8;}
.pay-error{display:none;border:1px solid var(--promo-red,#C0392B);background:#FDF3F2;color:#8E2A20;padding:12px 14px;margin-bottom:12px;font-family:var(--font-body);font-size:15px;line-height:1.5;white-space:pre-line;}
.pay-error.show{display:block;}
.btn-pay-sec{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dust);margin-bottom:20px;}
.btn-continue{width:100%;background:none;border:1px solid var(--linen);color:var(--slate);padding:14px 24px;font-family:var(--font-ui);font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:border-color 0.2s,color 0.2s;}
.btn-continue:hover{border-color:var(--heather);color:var(--heather);}
.pay-methods{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.pay-cgv{font-family:var(--font-body);font-size:12px;color:var(--dust);text-align:center;margin:8px 0 0;}
.pay-cgv a{color:inherit;text-decoration:underline;}
.pay-m{display:inline-flex;align-items:center;font-family:var(--font-ui);font-size:11px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--linen);padding:4px 7px;color:var(--dust);}

/* ── Upsell livraison gratuite (barre de progression) ── */
.ship-upsell{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;background:var(--lingon-pale);border:1px solid var(--lingon-mid);border-radius:6px;animation:upsellIn .35s ease;}
.ship-upsell img{width:36px;height:36px;object-fit:contain;flex-shrink:0;background:#fff;border-radius:4px;}
.ship-upsell-txt{flex:1;font-family:var(--font-body);font-size:13px;line-height:1.35;color:var(--lingon-deep);}
.ship-upsell-txt strong{font-weight:600;}
.ship-upsell-btn{flex-shrink:0;background:var(--lingon);color:#fff;border:none;padding:9px 13px;font-family:var(--font-ui);font-size:10px;letter-spacing:1px;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:background .15s,transform .12s;white-space:nowrap;}
.ship-upsell-btn:hover{background:var(--lingon-mid);}
.ship-upsell-btn:active{transform:scale(.96);}
@keyframes upsellIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── Cadeau offert ── */
.gift-block{border:1px dashed var(--heather);background:var(--heather-pale,#eef0e8);border-radius:8px;padding:16px 18px;margin-top:20px;animation:upsellIn .35s ease;}
.gift-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--heather);margin-bottom:12px;}
.gift-free{background:var(--heather);color:#fff;border-radius:20px;padding:3px 10px;font-size:10px;letter-spacing:1px;white-space:nowrap;}
.gift-choices{display:flex;gap:10px;flex-wrap:wrap;}
.gift-choice{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:106px;padding:10px 8px;border:1px solid var(--linen);background:var(--snow);border-radius:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;font-family:var(--font-body);}
.gift-choice img{width:56px;height:56px;object-fit:contain;}
.gift-choice-nm{font-size:11px;line-height:1.25;text-align:center;color:var(--midnight);}
.gift-choice:hover{border-color:var(--heather);}
.gift-choice.sel{border-color:var(--heather);box-shadow:0 0 0 2px var(--heather) inset;}
.gift-check{position:absolute;top:-8px;right:-8px;background:var(--heather);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
.gift-nudge{margin-top:20px;border:1px dashed var(--lingon-mid,#c9a26a);background:var(--lingon-pale,#f7f0e6);border-radius:8px;padding:12px 16px;font-family:var(--font-body);font-size:14px;color:var(--lingon-deep,#8a5a2a);text-align:center;}

/* ── Cross-sell "Complétez votre commande" ── */
.xsell{margin-top:32px;border-top:1px solid var(--linen);padding-top:24px;}
.xsell-h{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--midnight);margin-bottom:4px;}
.xsell-sub{font-family:var(--font-body);font-size:13px;font-style:italic;color:var(--dust);margin-bottom:16px;}
.xsell-track{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.xsell-track::-webkit-scrollbar{height:5px;}
.xsell-track::-webkit-scrollbar-thumb{background:var(--linen);border-radius:3px;}
.xsell-card{flex:0 0 148px;scroll-snap-align:start;border:1px solid var(--linen);border-radius:6px;padding:12px;background:var(--snow);display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s,transform .15s;}
.xsell-card:hover{border-color:var(--driftwood);box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.xsell-card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--cream);border-radius:4px;padding:6px;}
.xsell-name{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--heather);line-height:1.25;min-height:35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.xsell-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;}
.xsell-price{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--midnight);}
.xsell-add{background:var(--heather);color:#fff;border:none;width:30px;height:30px;font-size:17px;line-height:1;border-radius:4px;cursor:pointer;transition:background .15s,transform .12s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.xsell-add:hover{background:var(--heather-mid);}
.xsell-add:active{transform:scale(.9);}

/* ── Réassurance avant paiement ── */
.trust-list{margin:4px 0 16px;padding:0;list-style:none;}
.trust-list li{display:flex;align-items:center;gap:9px;font-family:var(--font-body);font-size:13px;color:var(--slate);padding:5px 0;}
.trust-list li svg{flex-shrink:0;color:var(--heather);}

@media(max-width:1024px){
  .cart-page-layout{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"items" "summary" "more";row-gap:32px;}
  .cart-page-summary{position:static;}
  .page-hero{padding:20px 20px 0;}
}
@media(max-width:600px){
  .cart-page-heading{display:none;}
  .cart-page-row{grid-template-columns:68px 1fr;gap:12px 14px;align-items:start;}
  .cpr-qty{grid-column:2;grid-row:2;justify-self:start;}
  .cpr-qty button{width:40px;height:40px;}
  /* Le prix est enveloppé (prix barré des promos) : c'est l'enveloppe qui se place */
  .cpr-price-wrap{grid-column:2;grid-row:2;justify-self:end;align-self:center;}
  .cpr-name{font-size:16px;}
  .cart-page-summary{padding:24px 18px;}
}
/* Champs du panier : 16 px minimum, sinon l'iPhone zoome à la saisie */
.ck-input{width:100%;border:1px solid var(--linen);background:var(--cream);padding:12px 14px;font-family:var(--font-body);font-size:16px;color:var(--midnight);outline:none;box-sizing:border-box;transition:border-color 0.2s;}
.ck-input:focus{border-color:var(--heather-text);}
.ck-label{display:block;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dust);margin-bottom:8px;}
.promo-section{margin-bottom:20px;}
.promo-toggle{background:none;border:none;padding:10px 0;font-family:var(--font-body);font-size:15px;font-style:italic;color:var(--heather-text);text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.promo-row{display:flex;gap:8px;margin-bottom:8px;}
.promo-input{flex:1;min-width:0;}
.promo-btn{background:none;border:1px solid var(--heather-text);color:var(--heather-text);padding:10px 14px;min-height:46px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background 0.2s,color 0.2s;}
.promo-btn:hover{background:var(--heather-text);color:var(--snow);}
.promo-msg{font-family:var(--font-body);font-size:14px;min-height:16px;}
.promo-msg.ok{color:var(--lingon);}
.promo-msg.err{color:#8E2A20;}
.promo-msg.info{color:var(--dust);}
.relay-picker{margin-bottom:20px;}
.relay-search-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.relay-country{flex:0 0 auto;width:auto;cursor:pointer;}
.relay-cp-input{flex:1 1 120px;}
.relay-search-btn{background:none;border:1px solid var(--heather-text);color:var(--heather-text);padding:10px 14px;min-height:46px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background 0.2s,color 0.2s;}
.relay-search-btn:hover{background:var(--heather-text);color:var(--snow);}
.relay-status{font-family:var(--font-body);font-size:14px;color:var(--dust);padding:8px 0;}
.relay-status.err{color:#8E2A20;}
.relay-retry{background:none;border:none;padding:6px 0;font:inherit;color:var(--heather-text);text-decoration:underline;cursor:pointer;}
.relay-list{list-style:none;margin:0 0 8px;padding:0;max-height:320px;overflow-y:auto;border:1px solid var(--linen);}
.relay-item{display:block;width:100%;text-align:left;background:var(--snow);border:none;border-bottom:1px solid var(--linen);padding:12px;cursor:pointer;transition:background 0.15s;font:inherit;}
.relay-list li:last-child .relay-item{border-bottom:none;}
.relay-item:hover,.relay-item.selected{background:var(--parchment);}
.relay-item.selected{box-shadow:inset 3px 0 0 var(--heather-text);}
.relay-item-name{font-family:var(--font-ui);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--midnight);margin-bottom:2px;}
.relay-item-addr{font-family:var(--font-body);font-size:14px;color:var(--dust);}
.relay-selected-info{font-family:var(--font-body);font-size:15px;color:var(--midnight);background:var(--parchment);padding:12px 14px;margin-bottom:8px;line-height:1.45;}
.relay-selected-info strong{font-family:var(--font-ui);font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.relay-hours{display:block;margin-top:6px;font-size:13px;color:var(--dust);}
.relay-change{background:none;border:none;padding:6px 0 0;font:inherit;font-size:14px;color:var(--heather-text);text-decoration:underline;cursor:pointer;}
.pickup-info{font-family:var(--font-body);font-size:15px;line-height:1.5;color:var(--slate);background:var(--parchment);padding:12px 14px;margin:-8px 0 20px;}
.pickup-only-note{font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--midnight);background:var(--parchment);padding:12px 14px;margin:-8px 0 20px;}
.pickup-only-note button{display:block;margin-top:6px;background:none;border:none;padding:4px 0;font:inherit;color:var(--heather-text);text-decoration:underline;cursor:pointer;text-align:left;}
.order-note{margin:0 0 18px;}
.order-note summary{cursor:pointer;font-family:var(--font-body);font-size:15px;font-style:italic;color:var(--heather-text);padding:6px 0;}
.order-note textarea{margin-top:8px;resize:vertical;}
.eur-note{font-family:var(--font-body);font-size:13px;color:var(--dust);margin:-16px 0 20px;text-align:right;}
/* Barre de paiement collante (mobile) : le total et le bouton restent à portée de pouce */
.pay-bar{display:none;}
@media(max-width:1024px){
  .pay-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:250;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--warm-white);border-top:1px solid var(--linen);box-shadow:0 -6px 20px rgba(27,33,24,0.08);transform:translateY(0);transition:transform .2s ease;}
  .pay-bar.is-hidden{transform:translateY(110%);}
  .pay-bar-total{font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dust);line-height:1.2;}
  .pay-bar-total strong{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--midnight);}
  .pay-bar .btn-pay{width:auto;margin:0;padding:15px 22px;font-size:12px;letter-spacing:2px;}
  body.page-panier{padding-bottom:84px;}
  /* Sur le panier mobile, la bulle WhatsApp masquait le bouton de paiement */
  body.page-panier #sd-wa-bubble{display:none !important;}
}
</style>
</head>
<body>
<div id="header-root"></div>

<div class="page-hero">
  <p class="hero-crumb"><a href="/" data-sv="Hem" data-fr="Accueil" data-en="Home">Accueil</a> / <span data-sv="Korg" data-fr="Panier" data-en="Cart">Panier</span></p>
  <h1 data-sv="Din <em>korg</em>" data-fr="Votre <em>panier</em>" data-en="Your <em>cart</em>">Votre <em>panier</em></h1>
</div>

<div class="section">
  <div id="cart-page-root"></div>
</div>

<!-- Barre de paiement collante (mobile) : total + bouton, masquée quand le
     vrai bouton « Payer » est à l'écran ou que le panier est vide. -->
<div class="pay-bar is-hidden" id="pay-bar" aria-hidden="true">
  <div class="pay-bar-total"><span data-sv="Totalt" data-fr="Total" data-en="Total">Total</span><strong id="pay-bar-amount"></strong></div>
  <button type="button" class="btn-pay" id="pay-bar-btn" onclick="doCheckout()" tabindex="-1"></button>
</div>
<div id="footer-root"></div>
