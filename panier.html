<script>(function(){try{var w=JSON.parse(localStorage.getItem('sd_wl_v1'));if(w&&w.id){var r=document.documentElement.style;if(w.color_primary){r.setProperty('--heather',w.color_primary);r.setProperty('--heather-mid',w.color_primary+'CC');}if(w.color_secondary){r.setProperty('--lingon',w.color_secondary);r.setProperty('--lingon-mid',w.color_secondary+'CC');}if(w.color_bg)r.setProperty('--cream',w.color_bg);if(w.color_text)r.setProperty('--midnight',w.color_text);if(w.font_display)r.setProperty('--font-display',"'"+w.font_display+"',Georgia,serif");if(w.font_body)r.setProperty('--font-body',"'"+w.font_body+"',Georgia,serif");if(w.font_ui)r.setProperty('--font-ui',"'"+w.font_ui+"',sans-serif");}}catch(e){}}());</script>
<style>
/* En-tête compact : sur le panier, la place va au contenu et au paiement */
.page-hero{max-width:var(--max-width);margin:0 auto;padding:32px 40px 0;}
.page-hero h1{font-family:var(--font-display);font-size:clamp(30px,4vw,44px);font-weight:300;color:var(--midnight);line-height:1.1;}
.page-hero h1 em{font-style:italic;color:var(--lingon);}
.page-hero .hero-crumb{font-family:var(--font-ui);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);margin-bottom:10px;}
.page-hero .hero-crumb a{color:var(--dust);text-decoration:none;}
.page-hero .hero-crumb a:hover{color:var(--lingon);}
.page-hero + .section{padding-top:28px;}

/* Cart layout */
/* Articles, puis récapitulatif ; les suggestions viennent après le
   récapitulatif (sur mobile, elles ne repoussent plus le paiement). */
.cart-page-layout{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;grid-template-areas:"items summary" "more summary";column-gap:48px;align-items:start;}
.cart-page-items{grid-area:items;}
.cart-page-summary{grid-area:summary;}
.cart-page-more{grid-area:more;}
/* Empêche le contenu large (carrousel, champ relais) de forcer la grille à déborder l'écran */
.cart-page-items,.cart-page-summary,.cart-page-more{min-width:0;}
.cart-continue{font-family:var(--font-ui);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:8px 0;transition:color 0.15s;}
.cart-continue:hover{color:var(--heather-text);}

/* Items list */
.cart-page-items{}
.cart-page-heading{font-family:var(--font-ui);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dust);border-bottom:1px solid var(--linen);padding-bottom:14px;margin-bottom:0;display:grid;grid-template-columns:1fr auto auto;gap:16px;}
.cart-page-row{display:grid;grid-template-columns:88px 1fr auto auto;gap:20px;align-items:center;padding:24px 0;border-bottom:1px solid var(--linen);}
.cpr-img{width:88px;height:88px;border-radius:2px;object-fit:contain;background:var(--warm-white);border:1px solid var(--linen);padding:6px;}
.cpr-info{}
.cpr-name{font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--midnight);margin-bottom:4px;}
.cpr-sub{font-family:var(--font-ui);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dust);}
.cpr-del{background:none;border:none;font-size:12px;color:var(--dust);padding:4px 8px;cursor:pointer;transition:color 0.15s;font-family:var(--font-ui);letter-spacing:1px;}
.cpr-del:hover{color:var(--lingon);}
.cpr-qty{display:flex;align-items:center;gap:0;border:1px solid var(--linen);background:var(--snow);}
.cpr-qty button{background:none;border:none;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--midnight);display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
.cpr-qty button:hover{background:var(--linen);}
.cpr-qty span{font-family:var(--font-ui);font-size:13px;width:28px;text-align:center;}
.cpr-price{font-family:var(--font-display);font-size:18px;color:var(--midnight);white-space:nowrap;min-width:60px;text-align:right;}

/* Empty state */
.cart-page-empty{text-align:center;padding:80px 20px;}
.cart-page-empty .empty-icon{color:var(--linen);margin-bottom:24px;}
.cart-page-empty h2{font-family:var(--font-display);font-size:32px;font-weight:300;color:var(--midnight);margin-bottom:12px;}
.cart-page-empty p{font-family:var(--font-body);font-size:17px;color:var(--dust);margin-bottom:32px;}

/* Summary box */
.cart-page-summary{background:var(--snow);border:1px solid var(--linen);padding:32px 28px;position:sticky;top:120px;}
/* Delivery toggle */
.delivery-toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--linen);border-radius:4px;overflow:hidden;margin-bottom:20px;}
.dt-btn{background:var(--snow);border:none;padding:12px 8px;min-height:48px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--slate);cursor:pointer;transition:background 0.15s,color 0.15s;text-align:center;line-height:1.35;}
.dt-btn small{display:block;font-size:11px;letter-spacing:0.5px;text-transform:none;margin-top:3px;opacity:.85;}
.dt-btn.active{background:var(--heather);color:var(--on-heather);}
.dt-btn:disabled{opacity:.45;cursor:not-allowed;}
.dt-btn:not(:last-child){border-right:1px solid var(--linen);}
.summary-title{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--midnight);margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid var(--linen);}
.summary-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:var(--font-body);font-size:15px;color:var(--slate);}
.summary-line.total{font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--midnight);margin-top:16px;padding-top:16px;border-top:1px solid var(--linen);margin-bottom:24px;align-items:flex-start;}
.summary-line.total > span:last-child{text-align:right;}
.summary-ship-bar{margin-bottom:20px;}
.summary-ship-text{font-family:var(--font-ui);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dust);margin-bottom:8px;line-height:1.45;}
.summary-bar{height:3px;background:var(--linen);border-radius:2px;overflow:hidden;}
.summary-bar-fill{height:100%;background:var(--moss);border-radius:2px;transition:width 0.4s ease;}
/* Le bouton qui compte le plus : couleur d'action franche, jamais l'air désactivé */
.btn-pay{width:100%;background:var(--lingon);color:var(--snow);border:none;padding:18px 24px;font-family:var(--font-ui);font-size:13px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;cursor:pointer;transition:background 0.2s;margin-bottom:12px;}
.btn-pay:hover{background:var(--lingon-hover);}
.btn-pay:disabled{cursor:progress;opacity:.8;}
.pay-error{display:none;border:1px solid var(--promo-red,#C0392B);background:#FDF3F2;color:#8E2A20;padding:12px 14px;margin-bottom:12px;font-family:var(--font-body);font-size:15px;line-height:1.5;white-space:pre-line;}
.pay-error.show{display:block;}
.btn-pay-sec{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dust);margin-bottom:20px;}
.btn-continue{width:100%;background:none;border:1px solid var(--linen);color:var(--slate);padding:14px 24px;font-family:var(--font-ui);font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:border-color 0.2s,color 0.2s;}
.btn-continue:hover{border-color:var(--heather);color:var(--heather);}
.pay-methods{display:flex;gap:6px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
.pay-cgv{font-family:var(--font-body);font-size:12px;color:var(--dust);text-align:center;margin:8px 0 0;}
.pay-cgv a{color:inherit;text-decoration:underline;}
.pay-m{display:inline-flex;align-items:center;font-family:var(--font-ui);font-size:11px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--linen);padding:4px 7px;color:var(--dust);}

/* ── Upsell livraison gratuite (barre de progression) ── */
.ship-upsell{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;background:var(--lingon-pale);border:1px solid var(--lingon-mid);border-radius:6px;animation:upsellIn .35s ease;}
.ship-upsell img{width:36px;height:36px;object-fit:contain;flex-shrink:0;background:#fff;border-radius:4px;}
.ship-upsell-txt{flex:1;font-family:var(--font-body);font-size:13px;line-height:1.35;color:var(--lingon-deep);}
.ship-upsell-txt strong{font-weight:600;}
.ship-upsell-btn{flex-shrink:0;background:var(--lingon);color:#fff;border:none;padding:9px 13px;font-family:var(--font-ui);font-size:10px;letter-spacing:1px;text-transform:uppercase;border-radius:4px;cursor:pointer;transition:background .15s,transform .12s;white-space:nowrap;}
.ship-upsell-btn:hover{background:var(--lingon-mid);}
.ship-upsell-btn:active{transform:scale(.96);}
@keyframes upsellIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* ── Cadeau offert ── */
.gift-block{border:1px dashed var(--heather);background:var(--heather-pale,#eef0e8);border-radius:8px;padding:16px 18px;margin-top:20px;animation:upsellIn .35s ease;}
.gift-title{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--heather);margin-bottom:12px;}
.gift-free{background:var(--heather);color:#fff;border-radius:20px;padding:3px 10px;font-size:10px;letter-spacing:1px;white-space:nowrap;}
.gift-choices{display:flex;gap:10px;flex-wrap:wrap;}
.gift-choice{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:106px;padding:10px 8px;border:1px solid var(--linen);background:var(--snow);border-radius:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;font-family:var(--font-body);}
.gift-choice img{width:56px;height:56px;object-fit:contain;}
.gift-choice-nm{font-size:11px;line-height:1.25;text-align:center;color:var(--midnight);}
.gift-choice:hover{border-color:var(--heather);}
.gift-choice.sel{border-color:var(--heather);box-shadow:0 0 0 2px var(--heather) inset;}
.gift-check{position:absolute;top:-8px;right:-8px;background:var(--heather);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
.gift-nudge{margin-top:20px;border:1px dashed var(--lingon-mid,#c9a26a);background:var(--lingon-pale,#f7f0e6);border-radius:8px;padding:12px 16px;font-family:var(--font-body);font-size:14px;color:var(--lingon-deep,#8a5a2a);text-align:center;}

/* ── Cross-sell "Complétez votre commande" ── */
.xsell{margin-top:32px;border-top:1px solid var(--linen);padding-top:24px;}
.xsell-h{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--midnight);margin-bottom:4px;}
.xsell-sub{font-family:var(--font-body);font-size:13px;font-style:italic;color:var(--dust);margin-bottom:16px;}
.xsell-track{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.xsell-track::-webkit-scrollbar{height:5px;}
.xsell-track::-webkit-scrollbar-thumb{background:var(--linen);border-radius:3px;}
.xsell-card{flex:0 0 148px;scroll-snap-align:start;border:1px solid var(--linen);border-radius:6px;padding:12px;background:var(--snow);display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s,transform .15s;}
.xsell-card:hover{border-color:var(--driftwood);box-shadow:var(--shadow-sm);transform:translateY(-2px);}
.xsell-card img{width:100%;aspect-ratio:1;object-fit:contain;background:var(--cream);border-radius:4px;padding:6px;}
.xsell-name{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--heather);line-height:1.25;min-height:35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.xsell-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;}
.xsell-price{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--midnight);}
.xsell-add{background:var(--heather);color:#fff;border:none;width:30px;height:30px;font-size:17px;line-height:1;border-radius:4px;cursor:pointer;transition:background .15s,transform .12s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.xsell-add:hover{background:var(--heather-mid);}
.xsell-add:active{transform:scale(.9);}

/* ── Réassurance avant paiement ── */
.trust-list{margin:4px 0 16px;padding:0;list-style:none;}
.trust-list li{display:flex;align-items:center;gap:9px;font-family:var(--font-body);font-size:13px;color:var(--slate);padding:5px 0;}
.trust-list li svg{flex-shrink:0;color:var(--heather);}

@media(max-width:1024px){
  .cart-page-layout{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"items" "summary" "more";row-gap:32px;}
  .cart-page-summary{position:static;}
  .page-hero{padding:20px 20px 0;}
}
@media(max-width:600px){
  .cart-page-heading{display:none;}
  .cart-page-row{grid-template-columns:68px 1fr;gap:12px 14px;align-items:start;}
  .cpr-qty{grid-column:2;grid-row:2;justify-self:start;}
  .cpr-qty button{width:40px;height:40px;}
  /* Le prix est enveloppé (prix barré des promos) : c'est l'enveloppe qui se place */
  .cpr-price-wrap{grid-column:2;grid-row:2;justify-self:end;align-self:center;}
  .cpr-name{font-size:16px;}
  .cart-page-summary{padding:24px 18px;}
}
/* Champs du panier : 16 px minimum, sinon l'iPhone zoome à la saisie */
.ck-input{width:100%;border:1px solid var(--linen);background:var(--cream);padding:12px 14px;font-family:var(--font-body);font-size:16px;color:var(--midnight);outline:none;box-sizing:border-box;transition:border-color 0.2s;}
.ck-input:focus{border-color:var(--heather-text);}
.ck-label{display:block;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dust);margin-bottom:8px;}
.promo-section{margin-bottom:20px;}
.promo-toggle{background:none;border:none;padding:10px 0;font-family:var(--font-body);font-size:15px;font-style:italic;color:var(--heather-text);text-decoration:underline;text-underline-offset:4px;cursor:pointer;}
.promo-row{display:flex;gap:8px;margin-bottom:8px;}
.promo-input{flex:1;min-width:0;}
.promo-btn{background:none;border:1px solid var(--heather-text);color:var(--heather-text);padding:10px 14px;min-height:46px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background 0.2s,color 0.2s;}
.promo-btn:hover{background:var(--heather-text);color:var(--snow);}
.promo-msg{font-family:var(--font-body);font-size:14px;min-height:16px;}
.promo-msg.ok{color:var(--lingon);}
.promo-msg.err{color:#8E2A20;}
.promo-msg.info{color:var(--dust);}
.relay-picker{margin-bottom:20px;}
.relay-search-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.relay-country{flex:0 0 auto;width:auto;cursor:pointer;}
.relay-cp-input{flex:1 1 120px;}
.relay-search-btn{background:none;border:1px solid var(--heather-text);color:var(--heather-text);padding:10px 14px;min-height:46px;font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background 0.2s,color 0.2s;}
.relay-search-btn:hover{background:var(--heather-text);color:var(--snow);}
.relay-status{font-family:var(--font-body);font-size:14px;color:var(--dust);padding:8px 0;}
.relay-status.err{color:#8E2A20;}
.relay-retry{background:none;border:none;padding:6px 0;font:inherit;color:var(--heather-text);text-decoration:underline;cursor:pointer;}
.relay-list{list-style:none;margin:0 0 8px;padding:0;max-height:320px;overflow-y:auto;border:1px solid var(--linen);}
.relay-item{display:block;width:100%;text-align:left;background:var(--snow);border:none;border-bottom:1px solid var(--linen);padding:12px;cursor:pointer;transition:background 0.15s;font:inherit;}
.relay-list li:last-child .relay-item{border-bottom:none;}
.relay-item:hover,.relay-item.selected{background:var(--parchment);}
.relay-item.selected{box-shadow:inset 3px 0 0 var(--heather-text);}
.relay-item-name{font-family:var(--font-ui);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--midnight);margin-bottom:2px;}
.relay-item-addr{font-family:var(--font-body);font-size:14px;color:var(--dust);}
.relay-selected-info{font-family:var(--font-body);font-size:15px;color:var(--midnight);background:var(--parchment);padding:12px 14px;margin-bottom:8px;line-height:1.45;}
.relay-selected-info strong{font-family:var(--font-ui);font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.relay-hours{display:block;margin-top:6px;font-size:13px;color:var(--dust);}
.relay-change{background:none;border:none;padding:6px 0 0;font:inherit;font-size:14px;color:var(--heather-text);text-decoration:underline;cursor:pointer;}
.pickup-info{font-family:var(--font-body);font-size:15px;line-height:1.5;color:var(--slate);background:var(--parchment);padding:12px 14px;margin:-8px 0 20px;}
.pickup-only-note{font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--midnight);background:var(--parchment);padding:12px 14px;margin:-8px 0 20px;}
.pickup-only-note button{display:block;margin-top:6px;background:none;border:none;padding:4px 0;font:inherit;color:var(--heather-text);text-decoration:underline;cursor:pointer;text-align:left;}
.order-note{margin:0 0 18px;}
.order-note summary{cursor:pointer;font-family:var(--font-body);font-size:15px;font-style:italic;color:var(--heather-text);padding:6px 0;}
.order-note textarea{margin-top:8px;resize:vertical;}
.eur-note{font-family:var(--font-body);font-size:13px;color:var(--dust);margin:-16px 0 20px;text-align:right;}
/* Barre de paiement collante (mobile) : le total et le bouton restent à portée de pouce */
.pay-bar{display:none;}
@media(max-width:1024px){
  .pay-bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:250;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--warm-white);border-top:1px solid var(--linen);box-shadow:0 -6px 20px rgba(27,33,24,0.08);transform:translateY(0);transition:transform .2s ease;}
  .pay-bar.is-hidden{transform:translateY(110%);}
  .pay-bar-total{font-family:var(--font-ui);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dust);line-height:1.2;}
  .pay-bar-total strong{display:block;font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--midnight);}
  .pay-bar .btn-pay{width:auto;margin:0;padding:15px 22px;font-size:12px;letter-spacing:2px;}
  body.page-panier{padding-bottom:84px;}
  /* Sur le panier mobile, la bulle WhatsApp masquait le bouton de paiement */
  body.page-panier #sd-wa-bubble{display:none !important;}
}
</style>

<body>
<div id="header-root"></div>

<div class="page-hero">
  <p class="hero-crumb"><a href="/" data-sv="Hem" data-fr="Accueil" data-en="Home">Accueil</a> / <span data-sv="Korg" data-fr="Panier" data-en="Cart">Panier</span></p>
  <h1 data-sv="Din <em>korg</em>" data-fr="Votre <em>panier</em>" data-en="Your <em>cart</em>">Votre <em>panier</em></h1>
</div>

<div class="section">
  <div id="cart-page-root"></div>
</div>

<!-- Barre de paiement collante (mobile) : total + bouton, masquée quand le
     vrai bouton « Payer » est à l'écran ou que le panier est vide. -->
<div class="pay-bar is-hidden" id="pay-bar" aria-hidden="true">
  <div class="pay-bar-total"><span data-sv="Totalt" data-fr="Total" data-en="Total">Total</span><strong id="pay-bar-amount"></strong></div>
  <button type="button" class="btn-pay" id="pay-bar-btn" onclick="doCheckout()" tabindex="-1"></button>
</div>
<div id="footer-root"></div>
<script src="js/app.js?v=37"></script>
<script>
/* Mode de livraison par defaut : POINT RELAIS, pas le retrait.
   Le retrait etait presolectionne, si bien qu'un visiteur de Lille lisait
   « Retrait en magasin — Gratuit » pour un atelier situe dans la Drome :

   automatiquement obligatoire si le panier contient un produit frais. */

const _CK_KEY = 'sd_checkout_state_v1';

/* Horaires d'un point relais ({jour:'lun', plages:['09:00-12:00',…]}),
   regroupés : « Lun–ven 09:00-12:00, 14:00-19:00 · Sam 09:00-12:00 ». */
function _relayHoursText(p) {
  const h = p && Array.isArray(p.horaires) ? p.horaires : [];
  if (!h.length) return '';
  const ORDRE = ['lun','mar','mer','jeu','ven','sam','dim'];
  const NOMS = { fr: ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'], en: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], sv: ['Mån','Tis','Ons','Tor','Fre','Lör','Sön'] };
  const noms = NOMS[LANG] || NOMS.fr;
  const jours = ORDRE.map(j => { const e = h.find(x => String(x.jour || '').toLowerCase().slice(0, 3) === j); return e && e.plages && e.plages.length ? [].concat(e.plages).join(', ') : ''; });
  const groupes = [];
  jours.forEach((pl, i) => {
    const g = groupes[groupes.length - 1];
    if (pl && g && g.pl === pl && g.fin === i - 1) g.fin = i;
    else if (pl) groupes.push({ deb: i, fin: i, pl });
  });
  return groupes.map(g => noms[g.deb] + (g.fin > g.deb ? '–' + noms[g.fin] : '') + ' ' + g.pl).join(' · ');
}

/* Code postal : en France, la recherche part seule au 5e chiffre */

// Produit le moins cher qui, ajouté, fait franchir le seuil de livraison gratuite
function _upsellPick(remaining, cartIds) {
  const avail = (window.PRODUCTS || []).filter(function(p) {
    const id = String(p.uuid || p.id);
    if (cartIds.has(id)) return false;
    if (p.pickup_only) return false;
    if (p.trackStock && p.stock !== null && p.stock <= 0) return false;
    return (p.price || 0) > 0;
  });
  /* On ne propose qu'un ajout raisonnable : dépenser 30 € de plus pour
     économiser 4,90 € de port ne convainc personne. */
  const crossers = avail.filter(function(p) { return p.price >= remaining && p.price <= remaining + 6; })
                        .sort(function(a, b) { return a.price - b.price; });
  return crossers.length ? crossers[0] : null;
}

function _xsellPrice(p) { return window.SDPrice ? SDPrice.effective(p.price, p) : p.price; }

/* ── Reprise d'un panier depuis un email de relance ─────────────
   Lien : panier.html?reprise=<commande>.<jeton>[&code=XXX]. Le panier
   abandonné est fusionné avec le panier en cours (on ne retire jamais
   ce que le client a ajouté depuis), le code de la semaine est appliqué,
   et la reprise est gardée pour que le serveur ajoute un éventuel
   cadeau de relance au paiement. */
window._reprise = (function () { try { return sessionStorage.getItem('sd_reprise') || null; } catch (e) { return null; } })();
(function () {
  var q = new URLSearchParams(location.search);
  var rep = q.get('reprise');
  if (!rep) return;
  var code = (q.get('code') || '').trim().toUpperCase();
  window._reprise = rep;
  try { sessionStorage.setItem('sd_reprise', rep); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  var BASE = window.SD_API_URL || 'https://admin.swedishcravings.fr';
  fetch(BASE + '/api/relance/panier?reprise=' + encodeURIComponent(rep))
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d) return;
      if (d.email && !window._custEmail) window._custEmail = d.email;
      if (!d.deja_payee && Array.isArray(d.items)) {
        d.items.forEach(function (it) { var k = String(it.id); cart[k] = Math.max(cart[k] || 0, it.qty); });
        saveCart(); updateCartBadge();
      }
      if (d.delivery_mode === 'pickup' || d.delivery_mode === 'mondial_relay') setDeliveryMode(d.delivery_mode);
      /* Le point relais de la commande abandonnée revient avec le panier :
         le client n'a plus qu'à payer. */
      if (d.delivery_mode === 'mondial_relay' && d.relay_point && d.relay_point.id) {
        window._selectedRelay = d.relay_point;
        window._relayCountry = d.relay_point.pays || window._relayCountry || 'FR';
        _saveCheckoutState();
      }
      renderCartPageFull();
      if (code) {
        window._promoInput = code;
        var appliquer = function () { applyPromoCode(); };
        if (typeof PRODUCTS !== 'undefined' && PRODUCTS.length) appliquer();
        else window.addEventListener('sdapi:ready', appliquer, { once: true });
      }
    })
    .catch(function () {});
})();

// ── Offre "cadeau offert" : chargée une fois, re-render au retour ──
/* Reprise de l'ancien choix unique : un client qui avait deja un cadeau
   memorise le retrouve, sans quoi son panier semblerait l'avoir perdu. */
window._giftChoices = (function(){
  try {
    var m = JSON.parse(localStorage.getItem('sd_gift_choices') || 'null');
    if (Array.isArray(m)) return m;
    var seul = localStorage.getItem('sd_gift_choice');
    return seul ? [seul] : [];
  } catch(e){ return []; }
})();
window._giftEarned = 0;
/* Une offre « 2 achetés, 1 offert » peut en accorder plusieurs : le
   choix est donc une liste, plafonnée par ce que le panier a mérité.
   Recliquer sur un cadeau déjà pris le retire. */
function selectGift(id){
  var l = window._giftChoices || [];
  var i = l.indexOf(id);
  if (i >= 0) l.splice(i, 1);
  else {
    var max = window._giftEarned || 0;
    if (l.length >= max) l.shift();      // le plus ancien cède la place
    l.push(id);
  }
  window._giftChoices = l;
  window._giftTouched = true;
  try { localStorage.setItem('sd_gift_choices', JSON.stringify(l)); } catch(e){}
  renderCartPageFull();
}

/* Combien de cadeaux le panier mérite. Copie fidèle de la règle du
   serveur (src/lib/cadeau.ts) : les deux DOIVENT dire la même chose,
   sinon le client choisit un cadeau qu'on lui retire au paiement. */
function giftEarned(offer, cart, subtotal){
  if (!offer) return 0;
  var trigIds = (offer.trigger_products || []).map(function(p){ return p.id; });
  var pas = Number(offer.trigger_qty) || 0;

  /* Réglage incomplet — des produits déclencheurs sans quantité, ou
     l'inverse : aucun cadeau. Échouer fermé, jamais ouvert. */
  if ((trigIds.length && !pas) || (pas && !trigIds.length)) return 0;

  var n = 0;
  if (offer.mode === 'quantite' && trigIds.length && pas) {
    var comptees = 0;
    Object.entries(cart || {}).forEach(function(e){
      var key = e[0], qty = e[1];
      if (!(qty > 0)) return;
      var ri = key.indexOf('_');
      var idStr = ri === -1 ? key : key.slice(0, ri);
      if (trigIds.indexOf(idStr) !== -1) comptees += qty;
    });
    n = Math.floor(comptees / pas);
  } else {
    n = subtotal >= (Number(offer.threshold) || 0) ? 1 : 0;
  }
  if (offer.max > 0) n = Math.min(n, offer.max);
  return Math.max(0, n);
}
(async function(){
  try {
    const r = await fetch((window.SD_API_URL || 'https://admin.swedishcravings.fr') + '/api/gift-offer');
    const j = await r.json();
    window._giftOffer = (j && j.offer) || null;
    try {
      var m = JSON.parse(localStorage.getItem('sd_gift_choices') || '[]');
      window._giftChoices = Array.isArray(m) ? m : [];
    } catch(e) { window._giftChoices = []; }
  } catch(e) { window._giftOffer = null; }
  renderCartPageFull();
})();

/* La page est redessinée d'un bloc (chargement des produits, cadeau, code…).
   On garde le champ actif et la position du curseur : sans cela, chaque
   redessin fermait le clavier mobile au milieu de la saisie. */
function renderCartPageFull() {
  const a = document.activeElement;
  const keep = a && a.id && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)
    ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  _renderCartPage();
  window._cartPageReady = true;
  if (keep) {
    const n = document.getElementById(keep.id);
    if (n && n !== document.activeElement) {
      n.focus({ preventScroll: true });
      try { if (keep.s != null) n.setSelectionRange(keep.s, keep.e); } catch (e) {}
    }
  }
  _updatePayBar();
}

function _payLabel() { return LANG === 'sv' ? 'Betala säkert →' : LANG === 'en' ? 'Pay securely →' : 'Payer en toute sécurité →'; }
function _payBarLabel() { return LANG === 'sv' ? 'Betala →' : LANG === 'en' ? 'Pay →' : 'Payer →'; }

/* Barre collante : total à jour, cachée quand le vrai bouton est visible */
function _updatePayBar() {
  const bar = document.getElementById('pay-bar');
  if (!bar) return;
  const hasItems = Object.values(cart).some(q => q > 0);
  const amt = document.getElementById('pay-bar-amount');
  if (amt) amt.textContent = window._lastTotal != null ? fmtPrice(window._lastTotal) : '';
  const btn = document.getElementById('pay-bar-btn');
  if (btn) { btn.textContent = window._payInFlight ? '…' : _payBarLabel(); btn.disabled = !!window._payInFlight; }
  const realBtn = document.querySelector('.cart-page-summary .btn-pay');
  if (window._payObs) window._payObs.disconnect();
  window._payBtnVisible = false;
  if (realBtn && 'IntersectionObserver' in window) {
    window._payObs = new IntersectionObserver(function (es) {
      window._payBtnVisible = es[0].isIntersecting;
      bar.classList.toggle('is-hidden', !hasItems || window._payBtnVisible);
    }, { threshold: 0.4 });
    window._payObs.observe(realBtn);
  }
  bar.classList.toggle('is-hidden', !hasItems || window._payBtnVisible);
}

function _renderCartPage() {
  const root = document.getElementById('cart-page-root');
  if (!root) return;

  /* Le panier se recale sur le stock avant d'etre dessine : ce que le
     client lit doit etre ce qu'il pourra payer. Le changement s'affiche

  if (typeof sdRevaliderPanier === 'function') {

  const entries = Object.entries(cart).filter(([,q]) => q > 0);

    root.innerHTML = `
      <div class="cart-page-empty">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

        <a href="/boutique" class="btn-primary">${LANG==='sv'?'Utforska butiken':LANG==='en'?'Explore the shop':'Explorer la boutique'}</a>
      </div>`;
    return;
  }

  const cartIdSet = new Set(entries.map(([key]) => { const i = key.indexOf('_'); return i === -1 ? key : key.slice(0, i); }));

  let subtotal = 0;
  // Hors articles déjà en promotion : l'assiette des codes fidélité et ami.
  let _remisable = 0;
  const itemRows = entries.map(([key, qty]) => {
    const _ri = key.indexOf('_');
    const idStr = _ri === -1 ? key : key.slice(0, _ri);
    const variant = _ri === -1 ? undefined : key.slice(_ri + 1);
    const _cpd = _sdCartProducts();
    const p = PRODUCTS.find(x => String(x.uuid || x.id) === idStr || x.id === parseInt(idStr)) || _cpd[idStr] || (window._SD_STATIC||[]).find(x => String(x.id) === idStr);
    if (!p) return '';
    const v = variant ? p.variants?.find(x => x.label === variant) : p.variants?.[0];
    const _base = v ? v.price : p.price;
    const _onSale = !!(window.SDPrice && SDPrice.active(p));
    const price = window.SDPrice ? SDPrice.effective(_base, p) : _base;
    const line = price * qty;
    subtotal += line;
    if (!_onSale) _remisable += line;
    const _priceCell = _onSale
      ? `<span class="cart-row-price-old">${fmtPrice(_base * qty)}</span><span class="cpr-price cart-row-price--sale">${fmtPrice(line)}</span>`
      : `<span class="cpr-price">${fmtPrice(line)}</span>`;
    return `
      <div class="cart-page-row">
        <img class="cpr-img" src="${p.photo || ''}" alt="${p.name?.[LANG] || p.name?.fr || ''}" onerror="this.style.display='none'">
        <div class="cpr-info">
          <div class="cpr-name">${p.name?.[LANG] || p.name?.fr || ''}</div>
          <div class="cpr-sub">${variant || p.weight || ''}</div>
          <div style="margin-top:10px;">
            <button class="cpr-del" onclick="removeItem('${key}');renderCartPageFull();" data-sv="Ta bort" data-fr="Supprimer" data-en="Remove">${LANG==='sv'?'Ta bort':LANG==='en'?'Remove':'Supprimer'}</button>
          </div>
        </div>
        <div class="cpr-qty">
          <button onclick="changeQty('${key}',-1);renderCartPageFull();">−</button>
          <span>${qty}</span>
          <button onclick="changeQty('${key}',1);renderCartPageFull();">+</button>
        </div>
        <div class="cpr-price-wrap" style="text-align:right;">${_priceCell}</div>
      </div>`;
  }).join('');

  // Produit "retrait uniquement" (frais, fragile…) dans le panier → toute la commande passe en click & collect
  const cartHasPickupOnly = entries.some(([key]) => {
    const _pi = key.indexOf('_');
    const idStr = _pi === -1 ? key : key.slice(0, _pi);
    const _cpp = _sdCartProducts();
    const pp = PRODUCTS.find(x => String(x.uuid || x.id) === idStr || x.id === parseInt(idStr)) || _cpp[idStr] || (window._SD_STATIC||[]).find(x => String(x.id) === idStr);
    return !!(pp && pp.pickup_only);
  });
  if (cartHasPickupOnly && window._deliveryMode !== 'pickup') setDeliveryMode('pickup');

  /* Miroir de INTERNATIONAL_COUNTRIES (back). La Suede y entre : elle
     etait proposee au client mais facturee au tarif France. La Suisse
     en sort — hors UE et 40 EUR TTC de port reel. */
  const INTL_COUNTRIES = ['ES','PT','IT','DE','NL','BE','LU','SE'];

  const _upProd = remaining > 0 ? _upsellPick(remaining, cartIdSet) : null;
  const _upHtml = _upProd ? (function(){

          <svg width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="5" width="8" height="6" rx="1"/><path d="M3 5V3.5a2 2 0 0 1 4 0V5"/></svg>
          <span>${LANG==='sv'?'Säker betalning via Stripe':LANG==='en'?'Secure payment via Stripe':'Paiement sécurisé via Stripe'}</span>
        </div>
        <div class="pay-methods" aria-label="${LANG==='sv'?'Godkända betalsätt':LANG==='en'?'Accepted payment methods':'Moyens de paiement acceptés'}">${sdPayLogos('pay-m')}</div>
        <div style="text-align:center;font-family:var(--font-body);font-size:13px;color:var(--dust);margin-top:10px;">${LANG==='sv'?'Betala i 3 eller 4 delar med Klarna eller Scalapay (enligt villkor) vid betalningen.':LANG==='en'?'Pay in 3 or 4 instalments with Klarna or Scalapay (subject to eligibility) at checkout.':'Paiement en 3 ou 4 fois avec Klarna ou Scalapay (selon éligibilité), proposé à l’étape du paiement.'}</div>
        <ul class="trust-list">
          <li>${_TRUST_CHK}${window._deliveryMode==='pickup'?(LANG==='sv'?'Upphämtning efter överenskommelse':LANG==='en'?'Pickup by appointment':'Retrait sur rendez-vous'):(LANG==='sv'?'Skickas inom 1–2 arbetsdagar':LANG==='en'?'Ships within 1–2 working days':'Expédié sous 24 à 48 h ouvrées')}</li>
          <li>${_TRUST_CHK}${LANG==='sv'?'Äkta svenska produkter':LANG==='en'?'Authentic Swedish products':'Produits suédois authentiques'}</li>
          <li>${_TRUST_CHK}${LANG==='sv'?'Kundservice som hjälper dig':LANG==='en'?'Responsive customer service':'Service client à votre écoute'}</li>
        </ul>

      <div class="cart-page-more">
        ${_crossSellHtml(cartIdSet)}
        <div style="margin-top:24px;">
          <a href="/boutique" class="cart-continue">← ${LANG==='sv'?'Fortsätt handla':LANG==='en'?'Continue shopping':'Continuer mes achats'}</a>
        </div>

}

/* Retire les produits « retrait uniquement » et rend la livraison possible */
function _retirerProduitsRetrait() {
  (window._pickupOnlyKeys || []).forEach(k => removeItem(k));
  setDeliveryMode('mondial_relay');
  renderCartPageFull();
}

function _calcPromoDiscount(promo, sub, remisable) {
  if (!promo) return 0;
  // Code fidélité, code ami : pas sur les articles déjà en promotion.
  if (promo.hors_promo && remisable != null) sub = remisable;
  if (promo.type === 'percent') return Math.round(Math.min(sub, (sub * promo.value) / 100) * 100) / 100;
  if (promo.type === 'fixed') return Math.min(sub, promo.value);
  return 0;
}

/* Motif d'un code refusé — par /api/promo/validate ou par le checkout. */
function _promoRefus(reason, minOrder) {
  const L = LANG || 'fr';
  const MSG = {
    not_yet:      L==='en'?'Code not yet valid':L==='sv'?'Koden är inte giltig ännu':'Code pas encore valide',
    expired:      L==='en'?'Code expired':L==='sv'?'Koden har gått ut':'Code expiré',
    exhausted:    L==='en'?'Code no longer available':L==='sv'?'Koden är inte längre tillgänglig':'Code plus disponible',
    already_used: L==='en'?'Code already used':L==='sv'?'Koden är redan använd':'Code déjà utilisé',
    min_order:    `${L==='en'?'Minimum order':L==='sv'?'Minsta order':'Commande minimum'} ${fmtPrice(minOrder || 0)} ${L==='en'?'required':L==='sv'?'krävs':'requise'}`,
    invalid:      L==='en'?'Invalid or inactive code':L==='sv'?'Ogiltig kod':'Code invalide ou inactif',
    email_required:   L==='en'?'Enter your email below to use this code':L==='sv'?'Ange din e-postadress nedan för att använda koden':'Indiquez votre email ci-dessous pour utiliser ce code',
    not_owner:        L==='en'?'This loyalty code belongs to another email address':L==='sv'?'Stamkundskoden hör till en annan e-postadress':'Ce code fidélité est lié à une autre adresse email',
    own_code:         L==='en'?'That’s your friend code — share it with your friends!':L==='sv'?'Det är din vänkod – dela den med dina vänner!':'C’est votre code ami : partagez-le à vos proches !',
    not_new_customer: L==='en'?'This friend code is for a first order only':L==='sv'?'Vänkoden gäller bara en första beställning':'Ce code ami est réservé à une première commande',
    only_promo_items: L==='en'?'This code does not apply to items already on sale':L==='sv'?'Koden gäller inte varor som redan är rabatterade':'Ce code ne s’applique pas aux articles déjà en promotion',
  };
  return MSG[reason] || MSG.invalid;
}

/* Code fidélité ou code ami : sa validité dépend de l'email du panier.
   On le revérifie quand l'email change, et on retente un code refusé. */
function _revaliderCodePromo() {
  const p = window._appliedPromo;
  const refuse = !p && window._promoInput && window._promoMsg && !window._promoMsg.ok;
  if (p || refuse) applyPromoCode();
}

/* Email du client connecté, pour le contrôle « 1 usage par client » */
function _sessionEmail() {
  try { return (JSON.parse(localStorage.getItem('sd_customer_v1') || 'null') || {}).customer_email || ''; }
  catch (e) { return ''; }
}

async function applyPromoCode() {
  const code = ((document.getElementById('promo-input')?.value || '') || window._promoInput || '').trim().toUpperCase();
  if (!code) return;
  const BASE = window.SD_API_URL || 'https://admin.swedishcravings.fr';
  const L = LANG || 'fr';

  // Sous-total courant : sert au contrôle du minimum de commande côté serveur
  const entries = Object.entries(cart).filter(([,q]) => q > 0);
  let st = 0;
  let base = 0; // hors articles déjà en promotion (codes fidélité et ami)
  entries.forEach(([key, qty]) => {
    const ri = key.indexOf('_'); const idStr = ri===-1?key:key.slice(0,ri);
    const _cpd = _sdCartProducts();
    const p = PRODUCTS.find(x => String(x.uuid||x.id)===idStr||(/^d+$/.test(idStr)&&x.id===parseInt(idStr)))||_cpd[idStr]||(window._SD_STATIC||[]).find(x=>String(x.id)===idStr);
    if (!p) return;
    const variant = ri===-1?undefined:key.slice(ri+1);
    const v = variant?p.variants?.find(x=>x.label===variant):p.variants?.[0];
    const _base = v?v.price:p.price;
    const ligne = (window.SDPrice?SDPrice.effective(_base,p):_base) * qty;
    st += ligne;
    if (!(window.SDPrice && SDPrice.active(p))) base += ligne;
  });
  // L'email du panier : un code fidélité ou un code ami ne vaut que pour un email.
  const email = ((document.getElementById('checkout-email-input')?.value) || window._custEmail || _sessionEmail() || '').trim();

  const fail = (text, info) => {
    window._appliedPromo = null; window._promoInput = code;
    window._promoMsg = { ok: false, info: !!info, text };
    _saveCheckoutState();
    renderCartPageFull();
  };

  try {
    // Validation serveur : la liste des codes n'est plus exposée publiquement
    const res = await fetch(BASE + '/api/promo/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, subtotal: st, base, email }),
    });
    if (!res.ok) throw new Error('validate failed');
    const r = await res.json();

    if (!r.valid) {
      /* Code ami d'un lien de parrainage qui ne servira plus : on cesse
         de le proposer à chaque visite. */
      if (['invalid', 'own_code', 'not_new_customer'].includes(r.reason)) {
        try {
          const p = JSON.parse(localStorage.getItem('sd_parrain') || 'null');
          if (p && p.code === code) localStorage.removeItem('sd_parrain');
        } catch (e) {}
      }
      /* Email pas encore saisi : ce n'est pas un refus, juste l'étape suivante */
      fail(_promoRefus(r.reason, r.min_order), r.reason === 'email_required');
      return;
    }

    window._appliedPromo = { code: r.code, type: r.type, value: r.value, min_order: r.min_order, kind: r.kind || null, hors_promo: !!r.hors_promo };
    window._promoInput = code;
    const discAmt = r.discount || 0;
    // Une partie du panier est déjà en promotion : on dit pourquoi la remise est plus petite.
    const horsPromo = r.hors_promo && base < st
      ? (L==='en'?' (items on sale excluded)':L==='sv'?' (rabatterade varor undantagna)':' (hors articles en promotion)')
      : '';
    const discLabel = r.type==='free_shipping'
      ? (L==='en'?'Free shipping applied!':L==='sv'?'Fri frakt aktiverad!':'Livraison offerte appliquée !')
      : `${L==='en'?'Discount':L==='sv'?'Rabatt':'Réduction'} −${fmtPrice(discAmt)} ${L==='en'?'applied!':L==='sv'?'tillämpas!':'appliquée !'}${horsPromo}`;
    window._promoMsg = { ok: true, text: discLabel };
    _saveCheckoutState();
    renderCartPageFull();
  } catch(e) {
    fail(L==='en'?'Error. Try again.':L==='sv'?'Fel. Försök igen.':'Erreur. Réessayez.');
  }
}

async function searchRelayPoints(cp) {
  if (!cp || cp.trim().length < 4) return;
  window._relaySearchCp = cp.trim();
  window._relayLastSearch = cp.trim();
  window._relayPoints = 'loading';
  window._relayErrMsg = '';
  window._relayChanging = true;   // l'ancien point reste valable tant qu'aucun autre n'est choisi
  _saveCheckoutState();
  renderCartPageFull();
  const L = LANG || 'fr';
  const BASE = window.SD_API_URL || 'https://admin.swedishcravings.fr';
  const pays = window._relayCountry || 'FR';
  try {
    /* Le panier n'interrogeait que Mondial Relay : il ne pouvait donc
       proposer que ses points, meme la ou un autre transporteur est
       moins cher — Shop2Shop est a 6,59 EUR vers l'Italie contre 7,88,
       et il est le seul a desservir la Suede. La route ci-dessous
       demande a UGO le transporteur le moins cher du pays, puis ne
       renvoie que SES points : un point relais appartient a un
       transporteur, le choix du point est donc celui du transporteur. */
    var res = await fetch(BASE + '/api/logspher/relay-points?cp=' + encodeURIComponent(cp.trim()) + '&country=' + encodeURIComponent(pays) + '&lang=' + encodeURIComponent(L));
    var data = res.ok ? await res.json() : null;
    if (!data) throw new Error('HTTP ' + res.status);
    var pts = Array.isArray(data) ? data : (data.points || []);
    window._relayPoints = pts;
    /* Service du transporteur indisponible : on le dit, avec « Réessayer »,
       au lieu de laisser croire qu'il n'y a aucun point près de chez lui. */
    window._relayErrMsg = (!pts.length && data.erreur) ? String(data.erreur) : '';
    window._relayCarrierName = data.carrier_name || '';
    window._relayPriceTE = data.price_te != null ? data.price_te : null;
  } catch(e) {
    window._relayPoints = [];
    window._relayErrMsg = L==='en' ? 'Pickup points could not be loaded.' : L==='sv' ? 'Utlämningsställena kunde inte laddas.' : 'Les points relais n’ont pas pu être chargés.';
  }
  _saveCheckoutState();
  renderCartPageFull();
}

function selectRelay(i) {
  const p = (window._relayPoints || [])[i];
  if (!p) return;
  window._selectedRelay = p;
  window._relayChanging = false;
  window._relayErr = false;
  _saveCheckoutState();
  if (typeof sdTrackShippingInfo === 'function') sdTrackShippingInfo('mondial_relay');
  renderCartPageFull();
  document.querySelector('.relay-change')?.focus({ preventScroll: true });
}

async function doCheckout() {
  // Checkout direct : plus de gate email/profil. Stripe Checkout collecte
  // lui-même l'email, le nom, le téléphone (et l'adresse si besoin) de façon
  // fiable + Apple/Google Pay. On passe juste le token si le client est déjà
  // connecté (pour rattacher la commande à son compte) — jamais obligatoire.
  if (window._payInFlight) return;
  window._payErr = '';
  const _pe = document.getElementById('pay-error');
  if (_pe) { _pe.textContent = ''; _pe.classList.remove('show'); }
  let session = null;
  try { session = JSON.parse(localStorage.getItem('sd_customer_v1') || 'null'); } catch(e) {}

  // Build item list
  const items = Object.entries(cart)
    .filter(([,q]) => q > 0)
    .map(([key, qty]) => {
      const ri = key.indexOf('_');
      const idStr = ri === -1 ? key : key.slice(0, ri);
      const variant = ri === -1 ? undefined : key.slice(ri + 1);
      const idInt = parseInt(idStr);
      let id = idStr;
      if (!isNaN(idInt) && /^\d+$/.test(idStr)) {
        const p = PRODUCTS.find(x => x.id === idInt || String(x.id) === idStr);
        if (p && p.uuid) id = p.uuid;
      }
      return Object.assign({ id, quantity: qty }, variant ? { variant } : {});
    });

  // Cadeau offert : envoyé si un choix est fait et le seuil atteint (revalidé côté serveur)
  try {
    if (window._giftOffer && (window._giftChoices || []).length) {
      let _sub = 0;
      Object.entries(cart).filter(([, q]) => q > 0).forEach(([key, qty]) => {
        const ri = key.indexOf('_'); const idStr = ri === -1 ? key : key.slice(0, ri);
        const _cpd = _sdCartProducts();
        const p = PRODUCTS.find(x => String(x.uuid || x.id) === idStr || x.id === parseInt(idStr)) || _cpd[idStr] || (window._SD_STATIC || []).find(x => String(x.id) === idStr);
        if (!p) return;
        const variant = ri === -1 ? undefined : key.slice(ri + 1);
        const v = variant ? (p.variants || []).find(x => x.label === variant) : (p.variants || [])[0];
        _sub += ((v ? v.price : p.price) || 0) * qty;
      });
      /* Le serveur revalide et tranche : on n'envoie que ce qui est
         mérité selon la même règle, un article par cadeau. */
      const _earned = giftEarned(window._giftOffer, cart, _sub);
      (window._giftChoices || []).slice(0, _earned).forEach(function(gid){
        if ((window._giftOffer.products || []).some(p => p.id === gid)) {
          items.push({ id: gid, quantity: 1, gift: true });
        }
      });
    }
  } catch(e) {}

  if (items.length === 0) return;

  /* Email obligatoire avant Stripe : il sert à la confirmation ET à la
     relance si le paiement n'aboutit pas. Pré-rempli ensuite chez Stripe,
     le client ne le tape qu'une fois. */
  const _emailEl = document.getElementById('checkout-email-input');
  const _email = ((_emailEl && _emailEl.value) || window._custEmail || '').trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(_email)) {
    const _err = document.getElementById('checkout-email-err');
    if (_err) _err.textContent = LANG === 'en' ? 'Please enter a valid email address.' : LANG === 'sv' ? 'Ange en giltig e-postadress.' : 'Merci d’indiquer une adresse email valide.';
    if (_emailEl) { _emailEl.style.borderColor = '#8E2A20'; _emailEl.setAttribute('aria-invalid', 'true'); _emailEl.focus(); _emailEl.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
    return;
  }
  window._custEmail = _email;
  try { localStorage.setItem('sd_checkout_email', _email); } catch (e) {}

  const isPickup = window._deliveryMode === 'pickup';
  const isMR = window._deliveryMode === 'mondial_relay';
  const BASE = window.SD_API_URL || 'https://admin.swedishcravings.fr';

  /* Pas d'alert() : sur mobile, la fenêtre système cassait le parcours
     et laissait le client chercher le sélecteur. On l'y amène. */
  if (isMR && !window._selectedRelay) {
    window._relayErr = true;
    renderCartPageFull();
    const picker = document.querySelector('.relay-picker');
    if (picker) picker.scrollIntoView({ block: 'center' });
    document.getElementById('relay-cp-input')?.focus({ preventScroll: true });
    return;
  }

  if (typeof sdTrackBeginCheckout === 'function') sdTrackBeginCheckout();

  // Proceed to Stripe checkout — Stripe collecte email/nom/téléphone/adresse
  _setPayBusy(true);
  try {
    const res = await fetch(BASE + '/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items,
        delivery_mode: window._deliveryMode || 'delivery',
        ...(session?.token ? { customer_token: session.token } : {}),
        customer_email: _email,
        lang: LANG,
        // Arrivée par un email de relance : le serveur y retrouve le cadeau éventuel.
        ...(window._reprise ? { reprise: window._reprise } : {}),
        promo_code: window._appliedPromo?.code || null,
        customer_note: (window._orderNote || '').trim() || null,
        ...(window._deliveryMode === 'mondial_relay' && window._selectedRelay ? {
          relay_point_id: window._selectedRelay.id,
          relay_point_name: window._selectedRelay.name,
          relay_point_address: window._selectedRelay.adresse + ', ' + window._selectedRelay.cp + ' ' + window._selectedRelay.ville,
          relay_point_pays: window._selectedRelay.pays || window._relayCountry || 'FR',
          relay_carrier_uuid: window._selectedRelay.carrier_uuid || null,
        } : {}),
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (data.url) {
      // Repère : on part vers Stripe. Si le client revient ici sans avoir
      // payé (cancel_url = panier), app.js proposera l'aide WhatsApp Victoria.
      try { sessionStorage.setItem('sd_from_stripe', '1'); } catch (e) {}
      window.location.href = data.url;
      return;                              // le bouton reste « … » jusqu'au départ
    }
    _setPayBusy(false);
    if (data.code === 'OUT_OF_STOCK') {
      // Stock insuffisant refusé par le serveur : la liste s'affiche au-dessus du bouton.
      const lines = (data.items || []).map(function(it){
        const s = it.available > 0
          ? (LANG === 'en' ? ('only ' + it.available + ' left') : LANG === 'sv' ? ('endast ' + it.available + ' kvar') : ('plus que ' + it.available + ' en stock'))
          : (LANG === 'en' ? 'out of stock' : LANG === 'sv' ? 'slut i lager' : 'épuisé');
        return '• ' + it.name + ' — ' + s;
      }).join('\n');
      const head = LANG === 'en' ? 'Some items are no longer available in the requested quantity:' : LANG === 'sv' ? 'Vissa varor finns inte i önskat antal:' : 'Certains articles ne sont plus disponibles dans la quantité demandée :';
      const foot = LANG === 'en' ? 'Please adjust your cart.' : LANG === 'sv' ? 'Justera din varukorg.' : 'Ajustez votre panier.';
      _showPayError(head + '\n' + lines + '\n' + foot);
    } else if (data.code === 'PROMO_REFUSED') {
      /* Code refusé au dernier moment (email changé, ami déjà client, code
         épuisé…) : on le dit sous le champ du code plutôt que de faire
         payer plein tarif sans prévenir. */
      window._appliedPromo = null;
      window._promoOpen = true;
      window._promoMsg = { ok: false, text: _promoRefus(data.reason, data.min_order) };
      _saveCheckoutState();
      renderCartPageFull();
      document.getElementById('promo-input')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    } else if (data.code === 'RELAY_POINT_REQUIRED') {
      window._relayErr = true;
      window._selectedRelay = null;
      renderCartPageFull();
      document.querySelector('.relay-picker')?.scrollIntoView({ block: 'center' });
    } else if (data.error && /^(BAD_EMAIL|PICKUP_ONLY|COUNTRY_NOT_SERVED|BAD_QUANTITY)$/.test(data.code || '')) {
      // Refus métier : le serveur envoie déjà le message dans la langue du client.
      _showPayError(String(data.error));
    } else {
      // ORDER_CREATE_FAILED, SERVER_ERROR ou réponse inattendue : rien n'a été débité.
      _showPayError(LANG === 'en' ? 'Payment could not start. Nothing was charged; please try again in a moment.' : LANG === 'sv' ? 'Betalningen kunde inte starta. Inget har debiterats, försök igen om en stund.' : 'Le paiement n’a pas pu démarrer. Rien n’a été débité : réessayez dans un instant.');
    }
  } catch(e) {
    console.error('[checkout]', e);
    _setPayBusy(false);
    _showPayError(LANG === 'en' ? 'Connection problem. Check your network and try again.' : LANG === 'sv' ? 'Anslutningsproblem. Kontrollera nätverket och försök igen.' : 'Problème de connexion. Vérifiez votre réseau et réessayez.');
  }
}

/* Un seul envoi à la fois : les doubles clics créaient des commandes
   brouillon en double, puis autant de relances. */
function _setPayBusy(on) {
  window._payInFlight = !!on;
  document.querySelectorAll('.btn-pay').forEach(function (b) {
    b.disabled = !!on;
    b.textContent = on ? '…' : (b.id === 'pay-bar-btn' ? _payBarLabel() : _payLabel());
  });
}

/* Erreur de paiement affichée au-dessus du bouton (plus d'alert()) */
function _showPayError(msg) {
  window._payErr = msg || '';
  renderCartPageFull();
  const el = document.getElementById('pay-error');
  if (el && msg) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* Retour depuis Stripe par « Précédent » : la page sort du cache avec le
   bouton bloqué sur « … ». On la remet en état. */
window.addEventListener('pageshow', function (e) {
  if (!e.persisted) return;
  window._payInFlight = false;
  renderCartPageFull();
});

// Re-render when API products load (handles timing with PRODUCTS array)
window.addEventListener('sdapi:ready', () => { renderCartPageFull(); if (typeof sdTrackViewCart === 'function') sdTrackViewCart(); });
if (typeof PRODUCTS !== 'undefined' && PRODUCTS.length && typeof sdTrackViewCart === 'function') sdTrackViewCart();
