<style>
/* ═══════════════════════════════════════════════════════════════
   CATALOGUE v3 — styles (handoff « Restructuration du catalogue »)
   Valeurs reprises au pixel. Desktop = base ; bascule mobile à 768 px.
   Tout est préfixé .c3- et scopé à #cat3-root pour ne pas toucher au
   header/footer du site.
   ═══════════════════════════════════════════════════════════════ */
#cat3-root{ --c3-top:0px; --c3-top2:0px;
  font-family:'EB Garamond',Georgia,serif; color:#241F1B; background:#FBF6EE; }
#cat3-root *{ box-sizing:border-box; }
#cat3-root a{ color:#8E7566; text-decoration:none; }
#cat3-root a:hover{ color:#B8492F; }
#cat3-root button{ font-family:inherit; }
#cat3-root input::placeholder{ color:#8E8478; }
@keyframes c3-in{ from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
@keyframes c3-pop{ 0%{transform:scale(.9)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
@keyframes c3-sheet{ from{transform:translateY(100%)} to{transform:none} }

/* HERO */
.c3-hero{ background:#F4EADB; border-bottom:1px solid #EADFCD; }
.c3-hero-in{ max-width:1460px; margin:0 auto; padding:40px 30px 36px; display:flex; gap:40px; align-items:center; flex-wrap:wrap; }
.c3-hero-txt{ flex:1 1 420px; min-width:300px; }
.c3-eyebrow{ font-family:'Jost',sans-serif; font-size:9.5px; letter-spacing:3.4px; text-transform:uppercase; color:#6E6459; }
.c3-h1{ font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(32px,4.2vw,52px); line-height:1.05; margin:12px 0 0; }
.c3-h1 em{ font-style:italic; color:#8E7566; }
.c3-hero-p{ font-family:'EB Garamond',serif; font-size:17px; line-height:1.55; color:#5B534B; max-width:440px; margin:12px 0 0; }
.c3-hero-grid{ flex:0 1 380px; min-width:260px; display:grid; grid-template-columns:1.4fr 1fr; grid-template-rows:repeat(2,84px); gap:8px; }
.c3-hg{ border-radius:1px; }
.c3-hg1{ grid-row:span 2; background:#E7D3C6; } .c3-hg2{ background:#DCE3D2; } .c3-hg3{ background:#EBDDBE; }

/* BARRE STICKY (recherche + envies) */
.c3-filterbar{ position:sticky; top:var(--c3-top); z-index:30; background:rgba(251,246,238,.96); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid #EADFCD; }
.c3-filterbar-in{ max-width:1460px; margin:0 auto; padding:11px 30px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.c3-search{ flex:1 1 240px; max-width:300px; padding:10px 14px; border:1px solid #DFD3C0; background:#fff; font-size:16px; color:#241F1B; outline:none; border-radius:3px; }
.c3-envies{ display:flex; gap:6px; flex-wrap:wrap; }
.c3-envies-desk{ flex:1; }
.c3-envie{ padding:7px 14px; border:1px solid #E0D3C0; background:#fff; color:#5B534B; font-family:'Jost',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; border-radius:999px; }
.c3-envie.on{ background:#8E7566; color:#fff; border-color:#8E7566; }
.c3-result{ font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:#6E6459; }
.c3-clear{ background:none; border:none; padding:0; cursor:pointer; font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase; color:#B8492F; }

/* CORPS : rail / produits / panier */
.c3-body-in{ max-width:1460px; margin:0 auto; padding:30px 30px 80px; display:flex; gap:34px; align-items:flex-start; flex-wrap:wrap; }
.c3-rail{ position:sticky; top:var(--c3-top2); flex:0 0 194px; display:flex; flex-direction:column; gap:3px; }
.c3-railtitle{ font-family:'Jost',sans-serif; font-size:9.5px; letter-spacing:3px; text-transform:uppercase; color:#6E6459; padding-bottom:10px; }
.c3-railfam{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%; text-align:left; background:transparent; border:none; border-left:2px solid transparent; padding:11px 10px 5px 10px; cursor:pointer; font-family:'Jost',sans-serif; font-size:9.5px; font-weight:500; color:#8C8276; letter-spacing:2.4px; text-transform:uppercase; }
.c3-railsub{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%; text-align:left; background:transparent; border:none; border-left:2px solid transparent; padding:6px 10px; cursor:pointer; font-family:'EB Garamond',serif; font-size:15px; font-weight:400; color:#3E3830; }
.c3-railsub.on{ background:#F2E9D9; border-left-color:#8E7566; color:#6B564A; }
.c3-railcnt{ font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0; text-transform:none; color:#8C8276; }
.c3-railfoot{ margin-top:16px; padding-top:14px; border-top:1px solid #EADFCD; font-family:'EB Garamond',serif; font-size:14.5px; line-height:1.5; color:#6E6459; }

.c3-main{ flex:5 1 460px; min-width:320px; display:flex; flex-direction:column; gap:6px; }
.c3-section{ padding-top:26px; }
.c3-sechead{ display:flex; align-items:baseline; gap:12px; padding-bottom:12px; margin-bottom:16px; border-bottom:1px solid #E3D8C6; }
.c3-sechead h2{ font-family:'Cormorant Garamond',serif; font-size:27px; font-weight:600; margin:0; }
.c3-seccount{ font-family:'Jost',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#8C8276; }
.c3-secfam{ margin-left:auto; font-family:'EB Garamond',serif; font-size:14.5px; font-style:italic; color:#6E6459; }
.c3-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:14px; }

/* CARTE PRODUIT */
.c3-card{ background:#fff; border:1px solid #EADFCD; border-radius:3px; display:flex; flex-direction:column; cursor:pointer; animation:c3-in .2s ease both; transition:box-shadow .16s, transform .16s; }
.c3-card:hover{ box-shadow:0 10px 22px rgba(80,62,48,.10); transform:translateY(-2px); }
.c3-imgwrap{ position:relative; aspect-ratio:1/1; border-radius:3px 3px 0 0; display:flex; align-items:center; justify-content:center; }
/* La photo tient ENTIÈRE dans le cadre (packshots) — jamais recadrée. */
.c3-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; padding:16px; border-radius:3px 3px 0 0; }
.c3-photo{ font-family:'Jost',sans-serif; font-size:8px; letter-spacing:2.2px; text-transform:uppercase; color:#7A6F62; }
.c3-flag{ position:absolute; top:9px; left:9px; font-family:'Jost',sans-serif; font-size:8.5px; letter-spacing:1.5px; text-transform:uppercase; padding:4px 8px; border-radius:2px; }
.c3-add{ position:absolute; right:10px; bottom:-19px; width:40px; height:40px; border-radius:50%; background:#fff; border:1px solid #E0D3C0; color:#8E7566; font-size:20px; line-height:1; cursor:pointer; box-shadow:0 3px 10px rgba(80,62,48,.14); z-index:2; transition:background .15s, color .15s, border-color .15s; }
.c3-add:hover{ background:#8E7566; color:#fff; border-color:#8E7566; }
.c3-step{ position:absolute; right:10px; bottom:-19px; display:flex; align-items:center; height:40px; background:#8E7566; border-radius:999px; box-shadow:0 3px 10px rgba(80,62,48,.18); animation:c3-pop .18s ease; z-index:2; }
.c3-step button{ width:34px; height:40px; background:none; border:none; color:#fff; font-size:17px; cursor:pointer; }
.c3-step button:first-child{ border-radius:999px 0 0 999px; } .c3-step button:last-child{ border-radius:0 999px 999px 0; }
.c3-step span{ min-width:16px; text-align:center; font-family:'Jost',sans-serif; font-size:13px; color:#fff; }
.c3-notify{ position:absolute; right:10px; bottom:-15px; height:32px; padding:0 13px; border-radius:999px; background:#fff; border:1px solid #E0D3C0; color:#5B534B; font-family:'Jost',sans-serif; font-size:9.5px; letter-spacing:1.3px; text-transform:uppercase; cursor:pointer; box-shadow:0 3px 10px rgba(80,62,48,.12); z-index:2; }
.c3-cbody{ padding:26px 13px 13px; flex:1; display:flex; flex-direction:column; gap:4px; }
.c3-name{ font-family:'Cormorant Garamond',serif; font-size:18px; font-weight:600; line-height:1.2; min-height:43px; }
.c3-meta{ font-family:'EB Garamond',serif; font-size:13.5px; font-style:italic; color:#6E6459; }
.c3-prices{ display:flex; align-items:baseline; gap:7px; margin-top:6px; }
.c3-price{ font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; }
.c3-old{ font-family:'EB Garamond',serif; font-size:13px; font-style:italic; color:#8C8276; text-decoration:line-through; }
.c3-price--sale{ color:#C0392B; }
.c3-promo{ position:absolute; top:9px; right:9px; background:#C0392B; color:#fff; font-family:'Jost',sans-serif; font-size:8.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase; padding:4px 8px; border-radius:2px; z-index:2; box-shadow:0 2px 6px rgba(120,30,20,.22); }
.c3-kilo{ font-family:'Jost',sans-serif; font-size:9.5px; letter-spacing:1.1px; color:#8C8276; }

/* PANIER (desktop) */
.c3-cart{ position:sticky; top:var(--c3-top2); flex:1 1 296px; min-width:270px; align-self:flex-start; background:#fff; border:1px solid #EADFCD; border-radius:4px; display:flex; flex-direction:column; overflow:hidden; }
.c3-cart-head{ padding:16px 18px 14px; border-bottom:1px solid #F0E8DA; display:flex; align-items:baseline; justify-content:space-between; }
.c3-cart-title{ font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; }
.c3-cart-count{ font-family:'Jost',sans-serif; font-size:10px; letter-spacing:1.8px; text-transform:uppercase; color:#8C8276; }
.c3-cart-empty{ padding:26px 18px 24px; }
.c3-cart-empty p{ font-family:'EB Garamond',serif; font-size:16px; line-height:1.5; color:#5B534B; margin:0 0 14px; }
.c3-suggs{ display:flex; flex-direction:column; gap:8px; }
.c3-sugg{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:#FBF6EE; border:1px solid #EFE6D6; padding:8px 10px; cursor:pointer; border-radius:3px; transition:border-color .15s; }
.c3-sugg:hover{ border-color:#8E7566; }
.c3-sugg-tint{ width:34px; height:34px; flex:none; border-radius:2px; }
.c3-sugg-name{ flex:1; font-family:'EB Garamond',serif; font-size:15px; line-height:1.25; color:#241F1B; }
.c3-sugg-price{ font-family:'Cormorant Garamond',serif; font-size:16px; font-weight:600; color:#6B564A; }
.c3-cart-lines{ padding:6px 8px; max-height:320px; overflow:auto; display:flex; flex-direction:column; }
.c3-line{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-bottom:1px solid #F5EFE3; }
.c3-line-tint{ width:38px; height:38px; flex:none; border-radius:2px; }
.c3-line-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.c3-line-name{ font-family:'EB Garamond',serif; font-size:15px; line-height:1.2; color:#241F1B; }
.c3-line-unit{ font-family:'Jost',sans-serif; font-size:9.5px; letter-spacing:1.2px; color:#8C8276; }
.c3-line-step{ display:flex; align-items:center; border:1px solid #E5DACA; border-radius:999px; }
.c3-line-step button{ width:26px; height:28px; background:none; border:none; color:#6B564A; font-size:15px; cursor:pointer; }
.c3-line-step span{ min-width:15px; text-align:center; font-family:'Jost',sans-serif; font-size:12px; }
.c3-line-total{ font-family:'Cormorant Garamond',serif; font-size:17px; font-weight:600; min-width:52px; text-align:right; }
.c3-cart-foot{ margin-top:auto; padding:14px 18px 18px; background:#FBF6EE; border-top:1px solid #F0E8DA; }
.c3-bar{ height:4px; border-radius:999px; background:#EDE2CF; overflow:hidden; }
.c3-bar-fill{ height:4px; background:#7E9464; transition:width .25s ease; }
.c3-shipmsg{ font-family:'EB Garamond',serif; font-size:14.5px; line-height:1.45; color:#5B534B; margin:9px 0 14px; }
.c3-subtotal{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
.c3-subtotal>span:first-child{ font-family:'Jost',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#6E6459; }
.c3-total{ font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; }
.c3-order{ width:100%; padding:14px; background:#8E7566; color:#fff; border:none; border-radius:3px; font-family:'Jost',sans-serif; font-size:11px; letter-spacing:2.2px; text-transform:uppercase; cursor:pointer; }
.c3-order.off{ background:#E5DACA; color:#9A9086; cursor:not-allowed; }
.c3-trust{ display:flex; justify-content:center; gap:14px; margin-top:11px; font-family:'Jost',sans-serif; font-size:9px; letter-spacing:1.4px; text-transform:uppercase; color:#8C8276; }

/* ÉTAT VIDE (recherche) */
.c3-empty{ text-align:center; padding:80px 20px; background:#fff; border:1px solid #EADFCD; }
.c3-empty-t{ font-family:'Cormorant Garamond',serif; font-size:27px; font-style:italic; color:#5B534B; margin:0 0 8px; }
.c3-empty-h{ font-family:'EB Garamond',serif; font-size:16px; color:#6E6459; margin:0 0 22px; }
.c3-empty-btn{ padding:13px 28px; background:#8E7566; color:#fff; border:none; font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; }

/* Éléments mobile masqués en desktop */
.c3-mhead, .c3-menvies, .c3-mobar{ display:none; }

/* ══════════════════ MOBILE (< 768 px) ══════════════════ */
@media(max-width:767px){
  #cat3-root{ background:#FBF6EE; }
  .c3-hero, .c3-filterbar, .c3-rail, .c3-cart{ display:none; }
  .c3-mhead, .c3-menvies{ display:block; }
  .c3-mobar{ display:block; }

  /* En-tête compact collant */
  .c3-mhead{ position:sticky; top:var(--c3-top); z-index:20; padding:12px 14px 0; background:rgba(251,246,238,.94); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid #EADFCD; }
  .c3-mhead-row{ display:flex; align-items:center; gap:10px; padding-bottom:10px; }
  .c3-mbrand{ flex:1; font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; line-height:1; }
  .c3-mref{ font-family:'Jost',sans-serif; font-size:9px; letter-spacing:1.6px; text-transform:uppercase; color:#8C8276; }
  .c3-search-m{ width:100%; height:44px; padding:0 14px; border:1px solid #DFD3C0; background:#fff; font-size:16px; color:#241F1B; outline:none; border-radius:10px; }
  .c3-chips{ display:flex; gap:7px; overflow-x:auto; padding:10px 0 9px; scrollbar-width:none; }
  .c3-chips::-webkit-scrollbar{ display:none; }
  .c3-chip{ flex:none; height:32px; padding:0 13px; border:1px solid #E0D3C0; background:#fff; color:#5B534B; font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:1.3px; text-transform:uppercase; white-space:nowrap; cursor:pointer; border-radius:999px; display:inline-flex; align-items:center; }
  .c3-chip.on{ background:#8E7566; color:#fff; border-color:#8E7566; }

  /* Envies mobile + résultat */
  .c3-menvies{ padding:14px 14px 0; }
  .c3-envies-mob{ display:flex; gap:7px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none; }
  .c3-envies-mob::-webkit-scrollbar{ display:none; }
  .c3-envies-mob .c3-envie{ flex:none; height:34px; padding:0 14px; white-space:nowrap; letter-spacing:1.4px; display:inline-flex; align-items:center; }
  .c3-mclear{ display:flex; align-items:center; justify-content:space-between; padding:0 2px 10px; }
  .c3-mclear .c3-result{ letter-spacing:1.5px; }

  /* Corps : produits pleine largeur, 2 colonnes */
  .c3-body-in{ padding:0; }
  .c3-main{ flex:1 1 100%; min-width:0; width:100%; padding:0 14px 150px; gap:0; }
  .c3-section{ padding-top:20px; }
  .c3-sechead{ gap:9px; padding-bottom:10px; margin-bottom:12px; }
  .c3-sechead h2{ font-size:22px; }
  .c3-seccount{ font-size:9.5px; letter-spacing:1.8px; }
  .c3-secfam{ display:none; }
  .c3-grid{ grid-template-columns:1fr 1fr; gap:11px; }

  /* Carte mobile */
  .c3-card{ border-radius:10px; }
  .c3-imgwrap{ border-radius:9px 9px 0 0; }
  .c3-img{ padding:11px; border-radius:9px 9px 0 0; }
  .c3-photo{ font-size:7.5px; letter-spacing:2px; }
  .c3-flag{ top:8px; left:8px; font-size:8px; letter-spacing:1.3px; padding:3px 7px; border-radius:3px; }
  .c3-promo{ top:8px; right:8px; font-size:8px; letter-spacing:.8px; padding:3px 7px; border-radius:3px; }
  .c3-add{ right:8px; bottom:-20px; width:44px; height:44px; font-size:22px; box-shadow:0 3px 10px rgba(80,62,48,.16); }
  .c3-step{ right:8px; bottom:-20px; height:44px; box-shadow:0 3px 10px rgba(80,62,48,.2); }
  .c3-step button{ width:36px; height:44px; font-size:19px; }
  .c3-step span{ min-width:14px; }
  .c3-notify{ right:8px; bottom:-17px; height:36px; font-size:9px; letter-spacing:1.2px; box-shadow:0 3px 10px rgba(80,62,48,.14); }
  .c3-cbody{ padding:27px 11px 12px; gap:3px; }
  .c3-name{ font-size:16.5px; line-height:1.18; min-height:39px; }
  .c3-meta{ font-size:13px; }
  .c3-meta-o{ display:none; }
