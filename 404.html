<!-- Servie par Vercel pour toute adresse inconnue, à n'importe quelle profondeur
     (/a/b/c) : les liens relatifs doivent partir de la racine. -->
<base href="/">
<script>
/* Les e-mails de commande pointent vers /compte/commandes/<n°>, /compte/preferences
   et /compte/factures/… : ces adresses n'existent pas, on renvoie vers « Ma commande ». */
function _nfRedirect(p) {
  var m = String(p || '').match(/^\/compte\/(.+?)\/?$/);
  if (!m) return '';
  var c = m[1].match(/^commandes\/([^\/]+)/);
  if (c) return '/compte?commande=' + encodeURIComponent(decodeURIComponent(c[1]).replace(/[^\w\-]/g, '').slice(0, 30));
  var r = m[1].match(/^(preferences|factures)\b/);
  return '/compte' + (r ? '?rubrique=' + r[1] : '');
}
(function () { var u = _nfRedirect(location.pathname); if (u) location.replace(u); })();
</script>
