<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande confirmée | Swedish Cravings</title>
<meta name="robots" content="noindex">
<meta property="og:site_name" content="Swedish Cravings">
<link rel="stylesheet" href="css/style.css?v=23">
<script>const SD_API_URL = 'https://admin.swedishcravings.fr';</script>
<script>try{localStorage.removeItem('sd_cart');localStorage.removeItem('sd_cart_products');localStorage.removeItem('sd_parrain');}catch(e){}</script>
<script>(function(){try{var w=JSON.parse(localStorage.getItem('sd_wl_v1'));if(w&&w.id){var r=document.documentElement.style;if(w.color_primary){r.setProperty('--heather',w.color_primary);r.setProperty('--heather-mid',w.color_primary+'CC');}if(w.color_secondary){r.setProperty('--lingon',w.color_secondary);r.setProperty('--lingon-mid',w.color_secondary+'CC');}if(w.color_bg)r.setProperty('--cream',w.color_bg);if(w.color_text)r.setProperty('--midnight',w.color_text);if(w.font_display)r.setProperty('--font-display',"'"+w.font_display+"',Georgia,serif");if(w.font_body)r.setProperty('--font-body',"'"+w.font_body+"',Georgia,serif");if(w.font_ui)r.setProperty('--font-ui',"'"+w.font_ui+"',sans-serif");}}catch(e){}}());</script>
<style>
.sc-hero { background:var(--cream); border-bottom:1px solid var(--linen); }
.sc-hero-in { max-width:680px; margin:0 auto; padding:56px 24px 44px; text-align:center; }
.sc-check { width:56px; height:56px; margin:0 auto 18px; color:var(--lingon); }
.sc-hero h1 { font-family:var(--font-display); font-size:clamp(34px,5vw,56px); font-weight:300; line-height:1.08; color:var(--midnight); text-wrap:balance; }
.sc-hero h1 em { font-style:italic; color:var(--lingon); }
.sc-sub { font-family:var(--font-body); font-size:18px; line-height:1.65; color:var(--slate); max-width:520px; margin:16px auto 0; }

.sc-wrap { max-width:680px; margin:0 auto; padding:40px 24px 88px; }
.sc-card { background:var(--snow); border:1px solid var(--linen); }
.sc-card-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:6px 16px; padding:16px 24px; background:var(--parchment); border-bottom:1px solid var(--linen); }
.sc-num { font-family:var(--font-ui); font-size:13px; font-weight:600; letter-spacing:1.5px; color:var(--midnight); }
.sc-date { font-family:var(--font-ui); font-size:12px; letter-spacing:1px; color:var(--dust); }
.sc-sec { padding:20px 24px; }
.sc-sec-t { font-family:var(--font-ui); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--heather-text); margin-bottom:8px; }
.sc-line { display:flex; align-items:baseline; gap:12px; padding:9px 0; border-bottom:1px solid var(--parchment); font-family:var(--font-body); font-size:16px; color:var(--midnight); }
.sc-line-name { flex:1; min-width:0; overflow-wrap:anywhere; }
.sc-line-qty { font-family:var(--font-ui); font-size:12px; color:var(--dust); white-space:nowrap; }
.sc-line-price, .sc-row span:last-child { font-family:var(--font-display); font-size:18px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
.sc-totals { padding-top:10px; }
.sc-row { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:4px 0; font-family:var(--font-body); font-size:16px; color:var(--slate); }
.sc-row.disc span:last-child { color:var(--lingon); }
.sc-row.grand { margin-top:8px; padding-top:12px; border-top:1px solid var(--linen); font-size:17px; color:var(--midnight); }
.sc-row.grand span:last-child { font-size:22px; }
.sc-skel { height:14px; margin:12px auto; background:linear-gradient(90deg,var(--parchment) 25%,var(--linen) 50%,var(--parchment) 75%); background-size:200% 100%; animation:sc-shimmer 1.4s infinite; }
@keyframes sc-shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
.sc-vh { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; }
.sc-note { font-family:var(--font-body); font-size:16px; font-style:italic; color:var(--dust); text-align:center; }

.sc-next { margin-top:36px; }
.sc-next h2 { font-family:var(--font-display); font-size:clamp(24px,3vw,30px); font-weight:300; color:var(--midnight); margin-bottom:14px; }
.sc-next ol { list-style:none; counter-reset:sc; border-top:1px solid var(--linen); }
.sc-next li { position:relative; counter-increment:sc; padding:14px 0 14px 44px; border-bottom:1px solid var(--linen); font-family:var(--font-body); font-size:17px; line-height:1.65; color:var(--slate); }
.sc-next li::before { content:counter(sc); position:absolute; left:0; top:12px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid var(--driftwood); border-radius:50%; font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--heather-text); }
.sc-actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:36px; }
.sc-actions .btn-outline-dark { min-height:44px; }
@media (max-width:600px) {
  .sc-hero-in { padding:40px 20px 34px; }
  .sc-wrap { padding:28px 16px 64px; }
  .sc-card-head, .sc-sec { padding-left:16px; padding-right:16px; }
  .sc-actions a { flex:1 1 100%; text-align:center; }
}
@media (prefers-reduced-motion:reduce) { .sc-skel { animation:none; } }
</style>
</head>
<body>
<div id="header-root"></div>

<main>
<div class="sc-hero">
  <div class="sc-hero-in">
    <svg class="sc-check" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="28" cy="28" r="26"/><polyline points="17,29 25,37 40,21"/></svg>
    <h1 id="sc-title">Commande <em>confirmée</em></h1>
    <p class="sc-sub" id="sc-sub" aria-live="polite">Merci pour votre commande&nbsp;! Un e-mail de confirmation arrive dans quelques minutes.</p>
  </div>
</div>

<div class="sc-wrap">
  <div id="sc-recap" aria-live="polite"></div>
  <section class="sc-next" aria-labelledby="sc-next-t">
    <h2 id="sc-next-t">Et maintenant&nbsp;?</h2>
    <ol id="sc-steps"></ol>
  </section>
  <div class="sc-actions">
    <a href="/boutique" class="btn-primary" id="sc-shop">Continuer mes achats</a>
    <a href="/compte" class="btn-outline-dark" id="sc-track">Suivre ma commande</a>
  </div>
</div>
</main>

<div id="footer-root"></div>
<script src="js/app.js?v=39"></script>
<script src="js/sd-succes.js?v=1"></script>

<script src="js/sd-api-client.js?v=15"></script>
</body>
</html>
