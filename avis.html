<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Google tag + consentement (source unique : js/sd-consent.js) -->
<script src="/js/sd-consent.js?v=1"></script>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donner mon avis | Swedish Cravings</title>
<meta name="description" content="Donnez votre avis sur les produits suédois de votre commande Swedish Cravings.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Swedish Cravings">
<link rel="stylesheet" href="css/style.css?v=21">
<script>const SD_API_URL = 'https://admin.swedishcravings.fr';</script>
<script>(function(){try{var w=JSON.parse(localStorage.getItem('sd_wl_v1'));if(w&&w.id){var r=document.documentElement.style;if(w.color_primary){r.setProperty('--heather',w.color_primary);r.setProperty('--heather-mid',w.color_primary+'CC');}if(w.color_secondary){r.setProperty('--lingon',w.color_secondary);r.setProperty('--lingon-mid',w.color_secondary+'CC');}if(w.color_bg)r.setProperty('--cream',w.color_bg);if(w.color_text)r.setProperty('--midnight',w.color_text);if(w.font_display)r.setProperty('--font-display',"'"+w.font_display+"',Georgia,serif");if(w.font_body)r.setProperty('--font-body',"'"+w.font_body+"',Georgia,serif");if(w.font_ui)r.setProperty('--font-ui',"'"+w.font_ui+"',sans-serif");}}catch(e){}}());</script>
<style>
.svc-hero { background:var(--cream); border-bottom:1px solid var(--linen); }
.svc-hero-in { max-width:760px; margin:0 auto; padding:44px 40px 40px; }
.svc-hero h1 { font-family:var(--font-display); font-size:clamp(36px,5vw,60px); font-weight:300; line-height:1.05; color:var(--midnight); }
.svc-hero h1 em { font-style:italic; color:var(--lingon); }
.svc-lead { font-family:var(--font-body); font-size:18px; line-height:1.6; color:var(--slate); max-width:600px; margin-top:14px; }

.av-wrap { max-width:760px; margin:0 auto; padding:40px 40px 88px; --av-err:#8E2A20; }
.av-intro { font-family:var(--font-body); font-size:17px; line-height:1.7; color:var(--slate); margin-bottom:8px; }
.av-intro strong { color:var(--midnight); font-weight:600; }
.av-pub { font-family:var(--font-body); font-size:15px; font-style:italic; line-height:1.6; color:var(--dust); margin-bottom:28px; }
.av-pub a { color:inherit; text-decoration:underline; text-underline-offset:3px; }
.av-msg { padding:40px 24px; background:var(--parchment); text-align:center; font-family:var(--font-body); font-size:17px; line-height:1.7; color:var(--slate); }
.av-msg a { color:var(--lingon); text-decoration:underline; text-underline-offset:3px; }
.av-msg .btn-primary { margin-top:18px; text-decoration:none; color:var(--snow); }

.av-item { display:grid; grid-template-columns:80px 1fr; gap:20px; padding:24px; margin-bottom:16px; background:var(--snow); border:1px solid var(--linen); }
.av-img { width:80px; height:80px; object-fit:contain; background:var(--parchment); }
.av-noimg { width:80px; height:80px; background:var(--parchment); }
.av-name { font-family:var(--font-display); font-size:21px; font-weight:600; line-height:1.25; color:var(--heather-text); margin-bottom:14px; }
.av-item fieldset { border:none; margin:0 0 16px; padding:0; min-width:0; }
.av-item legend { font-family:var(--font-ui); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--slate); margin-bottom:8px; padding:0; }
/* Note chiffrée de 1 à 5 (pas d'étoiles) : de vrais boutons radio, stylés en cases */
.av-scale { display:flex; gap:6px; flex-wrap:wrap; }
.av-scale input { position:absolute; opacity:0; width:1px; height:1px; }
.av-scale label { display:flex; align-items:center; justify-content:center; width:44px; height:44px; border:1px solid var(--driftwood); background:var(--warm-white); font-family:var(--font-ui); font-size:15px; font-weight:500; color:var(--midnight); cursor:pointer; transition:background .15s, color .15s, border-color .15s; }
.av-scale label:hover { border-color:var(--lingon); }
.av-scale input:checked + label { background:var(--lingon); border-color:var(--lingon); color:var(--snow); }
.av-scale input:focus-visible + label { outline:2px solid var(--lingon); outline-offset:3px; }
.av-hint { font-family:var(--font-ui); font-size:11px; letter-spacing:1px; color:var(--dust); margin-top:8px; }
.av-chosen { font-family:var(--font-ui); font-size:13px; letter-spacing:1px; color:var(--midnight); margin-top:6px; min-height:18px; }
.av-label { display:block; font-family:var(--font-ui); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--slate); margin-bottom:8px; }
.av-opt { font-family:var(--font-body); font-size:14px; letter-spacing:0; text-transform:none; font-style:italic; color:var(--dust); }
.av-txt { width:100%; min-height:96px; padding:12px 14px; border:1px solid var(--driftwood); border-radius:1px; background:var(--snow); font-family:var(--font-body); font-size:17px; line-height:1.6; color:var(--midnight); resize:vertical; }
.av-txt:focus { border-color:var(--lingon); }
.av-send { margin-top:14px; min-height:48px; cursor:pointer; }
.av-send[disabled] { cursor:progress; opacity:.75; }
.av-state { font-family:var(--font-body); font-size:16px; line-height:1.6; margin-top:10px; min-height:1px; }
.av-state.ok { color:var(--lingon); }
.av-state.ko { color:var(--av-err); }
@media (max-width:600px) {
  .svc-hero-in { padding:28px 20px 30px; }
  .av-wrap { padding:28px 16px 64px; }
  .av-item { grid-template-columns:1fr; gap:12px; padding:20px 16px; }
  .av-img, .av-noimg { width:64px; height:64px; }
  .av-noimg { display:none; }
  .av-scale label { width:48px; }
}
</style>
</head>
<body>
<div id="header-root"></div>

<main>
<div class="svc-hero">
  <div class="svc-hero-in">
    <h1 data-sv="Ditt <em>omdöme</em>" data-fr="Votre <em>avis</em>" data-en="Your <em>review</em>">Votre <em>avis</em></h1>
    <p class="svc-lead" data-sv="Det hjälper nästa kunder att bestämma sig, och oss att välja rätt produkter." data-fr="Il aide les prochains clients à se décider, et nous aide à bien choisir nos produits." data-en="It helps the next customers decide, and helps us choose the right products.">Il aide les prochains clients à se décider, et nous aide à bien choisir nos produits.</p>
  </div>
</div>

<div class="av-wrap">
  <div id="avis-contenu" aria-live="polite"><p class="av-msg" data-sv="Laddar din beställning…" data-fr="Chargement de votre commande…" data-en="Loading your order…">Chargement de votre commande…</p></div>
</div>
</main>

<div id="footer-root"></div>
<script src="js/app.js?v=34"></script>
<script>
/* Dépôt d'avis, atteint depuis l'e-mail post-achat : /avis?c=<id commande>.
   Le serveur (/api/reviews) vérifie que la commande est payée et qu'elle
   contenait le produit noté ; un second envoi remplace le premier.
   LANG vient d'app.js : ne jamais le redéclarer ici. */
var AV_T = {
  noLink:   { fr: 'Ce lien est incomplet. Utilisez celui reçu par e-mail après votre commande.', en: 'This link is incomplete. Please use the one you received by email after your order.', sv: 'Länken är ofullständig. Använd länken du fick via e-post efter din beställning.' },
  notFound: { fr: 'Nous n’avons pas retrouvé cette commande. Le lien a peut-être expiré.', en: 'We could not find this order. The link may have expired.', sv: 'Vi hittade inte beställningen. Länken kan ha gått ut.' },
  netErr:   { fr: 'La commande n’a pas pu être chargée. Vérifiez votre connexion, puis rechargez la page.', en: 'The order could not be loaded. Check your connection, then reload the page.', sv: 'Beställningen kunde inte laddas. Kontrollera din anslutning och ladda om sidan.' },
  notPaid:  { fr: 'Cette commande n’est pas encore payée&nbsp;: vous pourrez donner votre avis une fois les produits reçus.', en: 'This order has not been paid yet: you can leave a review once you have received the products.', sv: 'Beställningen är inte betald ännu: du kan lämna ett omdöme när du har fått produkterna.' },
  empty:    { fr: 'Cette commande ne contient aucun produit à noter.', en: 'This order contains no products to review.', sv: 'Beställningen innehåller inga produkter att betygsätta.' },
  contact:  { fr: 'Une question&nbsp;? <a href="/contact">Écrivez-nous</a>.', en: 'A question? <a href="/contact">Write to us</a>.', sv: 'En fråga? <a href="/contact">Skriv till oss</a>.' },
  shop:     { fr: 'Voir la boutique', en: 'Visit the shop', sv: 'Till butiken' },
  intro:    { fr: 'Commande <strong>{n}</strong>. Donnez une note à ce que vous avez goûté&nbsp;: une note suffit, un mot fait plaisir.', en: 'Order <strong>{n}</strong>. Rate what you tasted: a score is enough, a few words are always welcome.', sv: 'Beställning <strong>{n}</strong>. Betygsätt det du har smakat: ett betyg räcker, några ord gör oss glada.' },
  pub:      { fr: 'Votre avis est publié sur la fiche du produit avec votre prénom et l’initiale de votre nom. <a href="/confidentialite">Confidentialité</a>', en: 'Your review is published on the product page with your first name and the initial of your last name. <a href="/confidentialite">Privacy</a>', sv: 'Ditt omdöme publiceras på produktsidan med ditt förnamn och initialen i ditt efternamn. <a href="/confidentialite">Integritet</a>' },
  legend:   { fr: 'Votre note sur 5', en: 'Your score out of 5', sv: 'Ditt betyg av 5' },
  hint:     { fr: '1 = décevant · 5 = excellent', en: '1 = disappointing · 5 = excellent', sv: '1 = en besvikelse · 5 = utmärkt' },
  chosen:   { fr: 'Votre note : ', en: 'Your score: ', sv: 'Ditt betyg: ' },
  comment:  { fr: 'Votre commentaire', en: 'Your comment', sv: 'Din kommentar' },
  optional: { fr: '(facultatif)', en: '(optional)', sv: '(valfritt)' },
  send:     { fr: 'Publier mon avis', en: 'Publish my review', sv: 'Publicera mitt omdöme' },
  resend:   { fr: 'Modifier mon avis', en: 'Update my review', sv: 'Ändra mitt omdöme' },
  sending:  { fr: 'Envoi…', en: 'Sending…', sv: 'Skickar…' },
  pick:     { fr: 'Choisissez une note de 1 à 5.', en: 'Choose a score from 1 to 5.', sv: 'Välj ett betyg från 1 till 5.' },
  ok:       { fr: 'Merci ! Votre avis est publié.', en: 'Thank you! Your review is published.', sv: 'Tack! Ditt omdöme är publicerat.' },
  refused:  { fr: 'Cet avis ne peut pas être enregistré pour cette commande. Écrivez-nous si le problème persiste.', en: 'This review cannot be saved for this order. Please write to us if the problem persists.', sv: 'Omdömet kan inte sparas för den här beställningen. Skriv till oss om problemet kvarstår.' },
  failed:   { fr: 'L’envoi n’a pas abouti. Réessayez dans un instant.', en: 'Sending failed. Please try again in a moment.', sv: 'Det gick inte att skicka. Försök igen om en stund.' }
};
var PAYEES = ['paid', 'confirmed', 'preparing', 'partial', 'shipped', 'delivered'];
function _at(k) { var o = AV_T[k]; return o[LANG] || o.fr; }
function _aesc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

var _av = { state: 'loading', order: null, produits: [], notes: {}, sent: {}, msgs: {}, busy: {} };

function _avMsg(key, withShop) {
  return '<div class="av-msg"><p>' + _at(key) + '</p>' + (withShop ? '<a class="btn-primary" href="/boutique">' + _at('shop') + '</a>' : '') + '<p style="margin-top:14px">' + _at('contact') + '</p></div>';
}
function _avRender() {
  var box = document.getElementById('avis-contenu');
  if (_av.state === 'loading') return;
  if (_av.state !== 'ready') { box.innerHTML = _avMsg(_av.state, _av.state !== 'netErr'); return; }
  /* Ce qui est en cours de saisie survit au changement de langue */
  _av.produits.forEach(function (p, i) { var t = document.getElementById('tx-' + i); if (t) p.draft = t.value; });
  box.innerHTML =
    '<p class="av-intro">' + _at('intro').replace('{n}', _aesc(_av.order.order_number || '')) + '</p>' +
    '<p class="av-pub">' + _at('pub') + '</p>' +
    _av.produits.map(function (p, i) {
      var note = _av.notes[i], m = _av.msgs[i];
      return '<form class="av-item" data-i="' + i + '" novalidate>' +
        (p.img ? '<img class="av-img" src="' + _aesc(p.img) + '" alt="" loading="lazy">' : '<div class="av-noimg" aria-hidden="true"></div>') +
        '<div>' +
          '<h2 class="av-name" id="nm-' + i + '">' + _aesc(p.nom) + '</h2>' +
          '<fieldset><legend>' + _at('legend') + '</legend><div class="av-scale">' +
            [1, 2, 3, 4, 5].map(function (n) {
              return '<input type="radio" name="note-' + i + '" id="n-' + i + '-' + n + '" value="' + n + '"' + (note === n ? ' checked' : '') + '>' +
                     '<label for="n-' + i + '-' + n + '">' + n + '</label>';
            }).join('') +
          '</div><p class="av-hint">' + _at('hint') + '</p>' +
          '<p class="av-chosen" id="ch-' + i + '" aria-live="polite">' + (note ? _at('chosen') + note + '/5' : '') + '</p></fieldset>' +
          '<label class="av-label" for="tx-' + i + '">' + _at('comment') + ' <span class="av-opt">' + _at('optional') + '</span></label>' +
          '<textarea class="av-txt" id="tx-' + i + '" maxlength="1500" aria-describedby="nm-' + i + '">' + _aesc(p.draft || '') + '</textarea>' +
          '<button type="submit" class="btn-primary av-send" id="bt-' + i + '"' + (_av.busy[i] ? ' disabled' : '') + '>' + (_av.busy[i] ? _at('sending') : _at(_av.sent[i] ? 'resend' : 'send')) + '</button>' +
          '<p class="av-state' + (m ? ' ' + m.cls : '') + '" id="ms-' + i + '" role="status">' + (m ? _at(m.key) : '') + '</p>' +
        '</div></form>';
    }).join('');
}

document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || t.type !== 'radio' || !/^note-\d+$/.test(t.name)) return;
  var i = +t.name.slice(5);
  _av.notes[i] = +t.value;
  var ch = document.getElementById('ch-' + i); if (ch) ch.textContent = _at('chosen') + t.value + '/5';
  if (_av.msgs[i] && _av.msgs[i].key === 'pick') { _av.msgs[i] = null; var ms = document.getElementById('ms-' + i); if (ms) { ms.textContent = ''; ms.className = 'av-state'; } }
});
document.addEventListener('submit', async function (e) {
  var f = e.target;
  if (!f || !f.classList || !f.classList.contains('av-item')) return;
  e.preventDefault();
  var i = +f.getAttribute('data-i');
  if (_av.busy[i]) return;                      // un seul envoi à la fois par produit
  var ms = document.getElementById('ms-' + i), bt = document.getElementById('bt-' + i);
  if (!_av.notes[i]) {
    _av.msgs[i] = { cls: 'ko', key: 'pick' }; ms.className = 'av-state ko'; ms.textContent = _at('pick');
    var first = document.getElementById('n-' + i + '-1'); if (first) first.focus();
    return;
  }
  _av.busy[i] = true; bt.disabled = true; bt.textContent = _at('sending');
  var key = 'failed', ok = false;
  try {
    var res = await fetch(SD_API_URL + '/api/reviews', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order_id: _av.orderId, product_id: _av.produits[i].id, rating: _av.notes[i], comment: document.getElementById('tx-' + i).value.trim(), lang: LANG })
    });
    ok = res.ok; key = ok ? 'ok' : (res.status === 403 || res.status === 400 ? 'refused' : 'failed');
  } catch (err) { key = 'failed'; }
  _av.busy[i] = false;
  if (ok) _av.sent[i] = true;
  _av.msgs[i] = { cls: ok ? 'ok' : 'ko', key: key };
  bt.disabled = false; bt.textContent = _at(_av.sent[i] ? 'resend' : 'send');
  ms.className = 'av-state ' + (ok ? 'ok' : 'ko'); ms.textContent = _at(key);
});

function onLangChange() { _avRender(); }
initPage('');

(async function () {
  var params = new URLSearchParams(location.search);
  _av.orderId = params.get('c') || params.get('order_id');
  if (!_av.orderId) { _av.state = 'noLink'; _avRender(); return; }
  var order = null, failed = false;
  try {
    var res = await fetch(SD_API_URL + '/api/orders/' + encodeURIComponent(_av.orderId) + '/public');
    if (res.ok) { var d = await res.json(); order = d.order; }
    else if (res.status !== 404) failed = true;
  } catch (e) { failed = true; }
  if (!order) { _av.state = failed ? 'netErr' : 'notFound'; _avRender(); return; }
  if (PAYEES.indexOf(order.status) === -1) { _av.state = 'notPaid'; _avRender(); return; }

  var lignes = [];
  try { lignes = typeof order.lines === 'string' ? JSON.parse(order.lines) : (order.lines || []); } catch (e) {}
  /* Un produit peut apparaître sur plusieurs lignes (variantes) : un seul avis par produit */
  var vus = {};
  lignes.forEach(function (l) {
    var pid = l && (l.product_id || l.id);
    if (!pid || vus[pid]) return;
    vus[pid] = 1;
    _av.produits.push({ id: pid, nom: l.name, img: l.image_url });
  });
  _av.order = order;
  _av.state = _av.produits.length ? 'ready' : 'empty';
  _avRender();
})();
</script>
<script src="js/sd-api-client.js?v=10"></script>
</body>
</html>
